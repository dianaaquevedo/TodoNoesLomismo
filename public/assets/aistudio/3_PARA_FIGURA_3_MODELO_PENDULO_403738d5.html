<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Cómo nace un modelo físico?</title>
  <style>
    :root{
      --madera:#5b3a22;
      --pizarra:#184f35;
      --tiza:#f5f1e7;
      --dorado:#f4c85a;
      --crema:#efe7d9;
      --oscuro:#17130f;
      --rojo:#a83b34;
      --azul:#2d66c3;
      --verde:#2f8f4e;
      --gris:#6d6b66;
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#111;
      font-family:"Segoe UI",Arial,sans-serif;
    }

    #app{
      width:100vw;
      height:100vh;
      display:grid;
      grid-template-columns:minmax(0,68fr) minmax(330px,32fr);
    }

    #leftPane{
      position:relative;
      min-width:0;
      overflow:hidden;
      border-right:5px solid #241910;
      background:#ded4c4;
    }

    #scene{
      width:100%;
      height:100%;
      display:block;
    }

    #sceneLabel{
      position:absolute;
      left:20px;
      top:18px;
      max-width:58%;
      padding:8px 13px;
      border-radius:10px;
      color:#fff7df;
      background:rgba(45,29,17,.76);
      border:1px solid rgba(255,255,255,.18);
      font-size:clamp(14px,1.3vw,20px);
      line-height:1.25;
      opacity:0;
      transform:translateY(-8px);
      transition:.35s ease;
      pointer-events:none;
    }
    #sceneLabel.visible{ opacity:1; transform:none; }

    #caption{
      position:absolute;
      left:5%;
      right:5%;
      bottom:58px;
      min-height:50px;
      padding:10px 16px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      color:white;
      background:rgba(13,10,8,.74);
      border:1px solid rgba(255,255,255,.16);
      font-size:clamp(14px,1.35vw,20px);
      line-height:1.28;
      text-align:center;
      opacity:0;
      transition:.25s ease;
      pointer-events:none;
    }
    #caption.visible{ opacity:1; }

    #controls{
      position:absolute;
      left:50%;
      bottom:10px;
      z-index:20;
      display:none;
      gap:10px;
      transform:translateX(-50%);
      white-space:nowrap;
    }

    #rightPane{
      position:relative;
      min-width:0;
      overflow:hidden;
      padding:15px 14px 22px;
      color:var(--tiza);
      background:
        linear-gradient(rgba(255,255,255,.02),rgba(255,255,255,.01)),
        repeating-linear-gradient(0deg,transparent 0 36px,rgba(255,255,255,.018) 37px 38px),
        var(--pizarra);
      border:12px solid var(--madera);
      box-shadow:inset 0 0 40px rgba(0,0,0,.28);
    }
    #rightPane::after{
      content:"";
      position:absolute;
      left:5%;
      right:5%;
      bottom:5px;
      height:6px;
      border-radius:10px;
      background:rgba(255,255,255,.16);
    }

    #boardTitle{
      width:100%;
      margin-bottom:10px;
      padding-bottom:9px;
      border-bottom:1px solid rgba(255,255,255,.22);
      color:var(--dorado);
      text-align:center;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(18px,1.6vw,26px);
      font-weight:800;
      letter-spacing:.2px;
    }

    #boardText{
      height:calc(100% - 56px);
      overflow:auto;
      padding:3px 5px 22px 1px;
      scrollbar-width:thin;
    }

    .boardItem{
      margin:10px 0;
      padding:10px 11px 10px 14px;
      border-left:4px solid rgba(244,200,90,.92);
      border-radius:8px;
      background:rgba(0,0,0,.12);
      font-family:"Comic Sans MS","Segoe Print",cursive;
      font-size:clamp(14px,1.18vw,19px);
      line-height:1.34;
      opacity:0;
      transform:translateX(12px);
      animation:boardIn .45s forwards;
    }
    .boardItem strong{ color:#ffe49d; }
    .boardQuestion{
      border-left-color:#9ee7c1;
      background:rgba(158,231,193,.09);
      font-size:clamp(15px,1.28vw,20px);
    }
    @keyframes boardIn{ to{ opacity:1; transform:none; } }

    #overlay{
      position:fixed;
      inset:0;
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:
        radial-gradient(circle at 50% 20%,rgba(244,200,90,.18),transparent 35%),
        rgba(13,10,8,.95);
      color:white;
    }

    .startCard{
      width:min(760px,94vw);
      padding:36px 30px 34px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:24px;
      background:rgba(255,255,255,.08);
      text-align:center;
    }
    .startCard h1{
      margin:0;
      color:#fff2c8;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(32px,4.5vw,58px);
      line-height:1.08;
    }

    button{
      border:0;
      border-radius:999px;
      padding:11px 22px;
      color:white;
      cursor:pointer;
      font:800 15px "Segoe UI",Arial,sans-serif;
      box-shadow:0 7px 20px rgba(0,0,0,.26);
      transition:.18s ease;
    }
    button:hover{ transform:translateY(-2px); filter:brightness(1.06); }
    button:disabled{ opacity:.55; cursor:default; transform:none; }
    #startBtn{ padding:14px 34px; font-size:17px; background:var(--verde); }
    #pauseBtn{ background:#c88b20; }
    #restartBtn{ background:#5f466f; }
    #exitBtn{ background:var(--rojo); }

    #voiceNote{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:120;
      display:none;
      max-width:430px;
      padding:10px 13px;
      border-radius:10px;
      background:#7f251f;
      color:white;
      font-size:14px;
    }

    @media(max-width:980px){
      html,body{ overflow:auto; }
      #app{
        min-height:100vh;
        height:auto;
        grid-template-columns:1fr;
        grid-template-rows:64vh 68vh;
      }
      #rightPane{ border-width:9px; }
      #caption{ bottom:58px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="leftPane" aria-label="Animación de la lámpara">
      <canvas id="scene"></canvas>
      <div id="sceneLabel"></div>
      <div id="caption"></div>
      <div id="controls" aria-label="Controles de reproducción">
        <button id="pauseBtn">PAUSAR</button>
        <button id="restartBtn">REGRESAR</button>
        <button id="exitBtn">SALIR</button>
      </div>
    </section>

    <aside id="rightPane" aria-label="Pizarra de resumen">
      <div id="boardTitle">VOLVIENDO A LA LÁMPARA</div>
      <div id="boardText"></div>
    </aside>
  </div>

  <div id="overlay">
    <div class="startCard">
      <h1>¿Cómo nace un modelo físico?</h1>
      <button id="startBtn">INICIAR</button>
    </div>
  </div>

  <div id="voiceNote">No se encontró una voz en español. La animación continuará, pero la narración puede no reproducirse.</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const boardTitle = document.getElementById("boardTitle");
  const boardText = document.getElementById("boardText");
  const sceneLabel = document.getElementById("sceneLabel");
  const caption = document.getElementById("caption");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const controls = document.getElementById("controls");
  const pauseBtn = document.getElementById("pauseBtn");
  const restartBtn = document.getElementById("restartBtn");
  const exitBtn = document.getElementById("exitBtn");
  const voiceNote = document.getElementById("voiceNote");

  let W=0, H=0, dpr=1;
  let runId=0;
  let running=false;
  let paused=false;
  let pauseStarted=0;
  let totalPause=0;
  let selectedVoice=null;
  let currentSceneIndex=0;
  let presentationEnded=false;
  let controlsUnlocked=false;
  let playbackOffsetMs=0;
  let presentationStartActive=0;
  const sceneTimeline=new Map();

  // Música de fondo: archivo onda.mp3 ubicado en la misma carpeta que este HTML.
  const backgroundMusic = new Audio("onda.mp3");
  backgroundMusic.loop = true;
  backgroundMusic.preload = "auto";
  backgroundMusic.volume = 0.16;
  const baseMusicVolume = 0.16;

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,p)=>a+(b-a)*p;
  const easeInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
  const easeOut=p=>1-Math.pow(1-p,3);

  const state={
    mode:"rest",
    modeStart:performance.now(),
    theta:0.42,
    fixedTheta:0.42,
    showWind:false,
    showForces:false,
    showParallelogram:false,
    showVelocity:false,
    showTangential:false,
    showUnknownMagnitudes:false,
    showUseVsApply:false,
    showFigure3:false,
    showVelocityAtEq:false,
    showLengthCompare:false,
    showExperimentalQuestion:false,
    showPendulumBuild:false,
    showIdealPendulum:false,
    showReflectionScene:false,
    showFinalQuestion:false,
    swingStart:0,
    swingDuration:5200,
    tangentialDemoStart:0,
    fullSwingStart:0,
    comparisonStart:0,
    pausedOffset:0
  };

  function nowActive(){
    const now=performance.now();
    return now-totalPause-(paused?now-pauseStarted:0);
  }

  function resetState(){
    Object.assign(state,{
      mode:"rest",
      modeStart:nowActive(),
      theta:0.42,
      fixedTheta:0.42,
      showWind:false,
      showForces:false,
      showParallelogram:false,
      showVelocity:false,
      showTangential:false,
      showUnknownMagnitudes:false,
      showUseVsApply:false,
      showFigure3:false,
      showVelocityAtEq:false,
      showLengthCompare:false,
      showExperimentalQuestion:false,
      showPendulumBuild:false,
      showIdealPendulum:false,
      showReflectionScene:false,
      showFinalQuestion:false,
      swingStart:0,
      swingDuration:5200,
      tangentialDemoStart:0,
      fullSwingStart:0,
      comparisonStart:0
    });
  }

  function setMode(mode,opts={}){
    state.mode=mode;
    state.modeStart=nowActive();
    Object.assign(state,opts);
  }

  function resizeCanvas(){
    dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    const r=canvas.getBoundingClientRect();
    canvas.width=Math.round(r.width*dpr);
    canvas.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W=r.width; H=r.height;
  }
  window.addEventListener("resize",resizeCanvas);
  resizeCanvas();

  function clearBoard(){ boardText.innerHTML=""; }
  function addBoard(html,{question=false}={}){
    const div=document.createElement("div");
    div.className="boardItem"+(question?" boardQuestion":"");
    div.innerHTML=html;
    boardText.appendChild(div);
    boardText.scrollTop=boardText.scrollHeight;
  }
  function board(title,items=[]){
    boardTitle.textContent=title;
    clearBoard();
    for(const item of items){
      if(typeof item==="string") addBoard(item);
      else addBoard(item.text,{question:!!item.question});
    }
  }

  function showCaption(text){
    caption.innerHTML=text;
    caption.classList.add("visible");
  }
  function hideCaption(){ caption.classList.remove("visible"); }
  function label(text){
    if(!text){ sceneLabel.classList.remove("visible"); return; }
    sceneLabel.textContent=text;
    sceneLabel.classList.add("visible");
  }

  function sleep(ms){
    const id=runId;
    const start=nowActive();
    return new Promise((resolve,reject)=>{
      function tick(){
        if(id!==runId) return reject(new Error("cancelled"));
        if(nowActive()-start>=ms) return resolve();
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  function startMusic(reset=false){
    try{
      if(reset){ backgroundMusic.currentTime = 0; }
      const playPromise = backgroundMusic.play();
      if(playPromise && typeof playPromise.catch === "function"){
        playPromise.catch(err=>console.warn("No se pudo reproducir onda.mp3. Verifique que esté en la misma carpeta del HTML.",err));
      }
    }catch(err){
      console.warn("No se pudo reproducir onda.mp3. Verifique que esté en la misma carpeta del HTML.",err);
    }
  }

  function pauseMusic(){
    if(!backgroundMusic.paused) backgroundMusic.pause();
  }

  function resumeMusic(){
    if(backgroundMusic.paused){
      backgroundMusic.play().catch(err=>console.warn("No se pudo reanudar onda.mp3",err));
    }
  }

  function stopMusic(){
    backgroundMusic.pause();
    try{ backgroundMusic.currentTime = 0; }catch(e){}
    backgroundMusic.volume = baseMusicVolume;
  }

  function setMusicVolume(v){
    backgroundMusic.volume = clamp(v,0,1);
  }

  function loadVoices(){
    const voices=speechSynthesis.getVoices();
    if(!voices.length) return false;
    const es=voices.filter(v=>/^es([-_]|$)/i.test(v.lang));
    const co=es.filter(v=>/es[-_]CO/i.test(v.lang));
    const maleHints=/male|mascul|jorge|carlos|diego|andres|andrés|juan|miguel|daniel/i;
    selectedVoice=co.find(v=>maleHints.test(v.name)) || co[0] || es.find(v=>maleHints.test(v.name)) || es[0] || voices[0];
    return !!selectedVoice;
  }

  async function waitVoices(){
    if(loadVoices()) return;
    await new Promise(resolve=>{
      let done=false;
      const finish=()=>{ if(done) return; done=true; loadVoices(); resolve(); };
      speechSynthesis.addEventListener("voiceschanged",finish,{once:true});
      setTimeout(finish,900);
    });
    if(!selectedVoice) voiceNote.style.display="block";
  }

  function speak(text,{rate=.88,pitch=.86,volume=1,captionText=""}={}){
    const id=runId;
    if(captionText) showCaption(captionText); else hideCaption();
    return new Promise((resolve,reject)=>{
      if(id!==runId) return reject(new Error("cancelled"));
      if(!("speechSynthesis" in window)){
        const approx=Math.max(1600,text.split(/\s+/).length*330);
        setTimeout(()=>{ hideCaption(); resolve(); },approx);
        return;
      }
      const u=new SpeechSynthesisUtterance(text);
      if(selectedVoice) u.voice=selectedVoice;
      u.lang=selectedVoice?.lang || "es-CO";
      u.rate=rate; u.pitch=pitch; u.volume=volume;
      u.onend=()=>{ hideCaption(); resolve(); };
      u.onerror=()=>{ hideCaption(); resolve(); };
      speechSynthesis.speak(u);
    });
  }

  function roundedRect(x,y,w,h,r,fill,stroke,lineWidth=1){
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
    if(fill){ ctx.fillStyle=fill; ctx.fill(); }
    if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lineWidth; ctx.stroke(); }
  }

  function drawRoom(){
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"#eee8dc");
    grad.addColorStop(.76,"#d6c9b7");
    grad.addColorStop(1,"#b9a48a");
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#65472f"; ctx.fillRect(0,0,W,24);
    ctx.fillStyle="#3f2b1d"; ctx.fillRect(0,24,W,8);
    ctx.fillStyle="#70523a"; ctx.fillRect(0,H*.88,W,H*.12);
    ctx.fillStyle="rgba(255,255,255,.08)"; ctx.fillRect(0,H*.88,W,4);
  }

  function pendulumGeom(theta=state.theta){
    const pivotX=W*.49;
    const pivotY=H*.13;
    const L=Math.min(H*.43,W*.34);
    return {
      pivotX,pivotY,L,theta,
      x:pivotX+L*Math.sin(theta),
      y:pivotY+L*Math.cos(theta)
    };
  }


  function flameShouldStayVertical(){
    return state.mode==="held" || state.mode==="forces" || state.mode==="figure3";
  }

  function drawChainAndLamp(g,now){
    const {pivotX,pivotY,x,y,theta,L}=g;
    // vertical equilibrium guide
    ctx.save();
    ctx.setLineDash([6,8]);
    ctx.strokeStyle="rgba(70,65,58,.35)";
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pivotX,pivotY); ctx.lineTo(pivotX,pivotY+L+100); ctx.stroke();
    ctx.restore();

    // arc path
    ctx.save();
    ctx.setLineDash([3,10]);
    ctx.strokeStyle="rgba(90,80,70,.35)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(pivotX,pivotY,L,Math.PI/2-.52,Math.PI/2+.52);
    ctx.stroke();
    ctx.restore();

    // support point
    ctx.fillStyle="#2d2118";
    ctx.beginPath(); ctx.arc(pivotX,pivotY,7,0,Math.PI*2); ctx.fill();

    // chain
    ctx.strokeStyle="#4a382b"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(pivotX,pivotY); ctx.lineTo(x,y); ctx.stroke();
    const links=14;
    for(let i=1;i<links;i++){
      const q=i/links;
      const lx=lerp(pivotX,x,q), ly=lerp(pivotY,y,q);
      ctx.save(); ctx.translate(lx,ly); ctx.rotate(-theta);
      ctx.strokeStyle="rgba(92,66,46,.86)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(0,0,3.4,5.4,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }

    // lamp body, rotated with chain
    ctx.save(); ctx.translate(x,y); ctx.rotate(-theta);
    const glow=ctx.createRadialGradient(0,30,8,0,30,105);
    glow.addColorStop(0,"rgba(255,226,125,.36)"); glow.addColorStop(1,"rgba(255,190,70,0)");
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,30,105,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#493321"; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(-35,-3); ctx.lineTo(35,-3); ctx.stroke();
    ctx.strokeStyle="#5d402a"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(-31,-1); ctx.lineTo(-45,66); ctx.moveTo(31,-1); ctx.lineTo(45,66); ctx.moveTo(-45,66); ctx.lineTo(45,66); ctx.stroke();
    roundedRect(-51,63,102,14,6,"#463023","#211710",2);
    roundedRect(-34,76,68,9,4,"#5a3c27","#211710",1.5);
    roundedRect(-10,28,20,37,5,"#f5ead0","#cdbb91",1.2);
    ctx.fillStyle="#222"; ctx.fillRect(-1,22,2,7);
    const flick=.8*Math.sin(now*.022)+.5*Math.sin(now*.031);
    // Mientras la lámpara está sostenida en la amplitud máxima, la llama
    // conserva la vertical del espacio. Al soltarse, vuelve a acompañar
    // visualmente el movimiento de la lámpara.
    ctx.translate(0,20);
    if(state.mode==="held" || state.mode==="forces") ctx.rotate(theta);
    ctx.translate(flick,0);
    ctx.fillStyle="#f26c2f"; ctx.beginPath(); ctx.moveTo(0,-24); ctx.bezierCurveTo(11,-12,8,1,0,5); ctx.bezierCurveTo(-9,0,-10,-12,0,-24); ctx.fill();
    ctx.fillStyle="#ffe98a"; ctx.beginPath(); ctx.moveTo(0,-16); ctx.bezierCurveTo(5,-8,4,-2,0,1); ctx.bezierCurveTo(-4,-3,-4,-9,0,-16); ctx.fill();
    ctx.restore();
  }

  function arrow(x1,y1,x2,y2,{color="#222",width=4,head=14,dash=[],alpha=1}={}){
    const a=Math.atan2(y2-y1,x2-x1);
    ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=width; ctx.lineCap="round"; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-head*Math.cos(a-Math.PI/7),y2-head*Math.sin(a-Math.PI/7)); ctx.lineTo(x2-head*Math.cos(a+Math.PI/7),y2-head*Math.sin(a+Math.PI/7)); ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function canvasText(text,x,y,{font='700 18px "Segoe UI",Arial,sans-serif',color="#2b211a",align="center",bg=null,pad=8}={}){
    ctx.save(); ctx.font=font; ctx.textAlign=align; ctx.textBaseline="middle";
    const m=ctx.measureText(text); let bx=x-m.width/2-pad;
    if(align==="left") bx=x-pad;
    if(bg) roundedRect(bx,y-15,m.width+pad*2,30,8,bg,"rgba(0,0,0,.16)",1);
    ctx.fillStyle=color; ctx.fillText(text,x,y); ctx.restore();
  }

  function vecLabel(text,x,y,color){
    canvasText(text,x,y,{font:'italic 800 20px Georgia,"Times New Roman",serif',color,bg:"rgba(255,250,238,.94)",pad:7});
    ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.6;
    const w=text.length>1?24:16;
    ctx.beginPath(); ctx.moveTo(x-w/2,y-12); ctx.lineTo(x+w/2,y-12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w/2,y-12); ctx.lineTo(x+w/2-6,y-16); ctx.lineTo(x+w/2-5,y-8); ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawWind(g,now){
    const x2=g.x+12, y2=g.y+30;
    const len=clamp(W*.16,110,170);
    const pulse=1+.05*Math.sin(now*.008);
    arrow(x2-len,y2,x2,y2,{color:"#4a9ac8",width:6,head:16*pulse});
    for(let k=0;k<12;k++){
      const phase=(now*.12+k*48)%(len+120);
      const px=x2-len-70+phase;
      const py=y2-95+(k%5)*38+12*Math.sin(now*.004+k);
      ctx.fillStyle="rgba(93,170,207,.55)";
      ctx.beginPath(); ctx.arc(px,py,2.2,0,Math.PI*2); ctx.fill();
    }
    canvasText("viento",x2-len*.55,y2-22,{color:"#276886",bg:"rgba(245,252,255,.88)"});
  }

  function initialForceData(g){
    const theta=g.theta;
    const G=Math.min(145,H*.18);
    const T=G*Math.cos(theta);
    const ux=-Math.sin(theta), uy=-Math.cos(theta);
    const O={x:g.x,y:g.y};
    const t={x:O.x+T*ux,y:O.y+T*uy};
    const grav={x:O.x,y:O.y+G};
    const sum={x:t.x,y:t.y+G};
    return {O,t,grav,sum,G,T,ux,uy};
  }

  function tangentialUnit(theta){
    // Direction toward equilibrium for theta > 0.
    return {x:-Math.cos(theta),y:Math.sin(theta)};
  }

  function drawVelocityAndTangential(g,p){
    const q=clamp(p,0,1);
    const tu=tangentialUnit(g.theta);
    const speed=40+125*q;
    const force=115*(1-q);

    // VELOCIDAD: siempre debajo del vector para separarla visualmente de la fuerza.
    if(state.showVelocity){
      arrow(g.x,g.y,g.x+tu.x*speed,g.y+tu.y*speed,{color:"#2f8f4e",width:5,head:15});
      const vx=g.x+tu.x*speed*.58;
      const vy=g.y+tu.y*speed*.58+38;
      if(state.showTangential && force<=7){
        canvasText("VELOCIDAD MÁXIMA",vx,vy+12,{font:'800 15px "Segoe UI",Arial,sans-serif',color:"#246d3b",bg:"rgba(244,255,247,.95)"});
      }else{
        canvasText("VELOCIDAD",vx,vy,{font:'800 15px "Segoe UI",Arial,sans-serif',color:"#246d3b",bg:"rgba(244,255,247,.95)"});
        if(state.showTangential){
          canvasText("aumenta",vx,vy+30,{font:'700 13px "Segoe UI",Arial,sans-serif',color:"#246d3b",bg:"rgba(244,255,247,.88)"});
        }
      }
    }

    // FUERZA: se coloca por encima del movimiento y su vector se acorta al acercarse al equilibrio.
    if(state.showTangential){
      const normalOffset=30;
      const nx=-tu.y, ny=tu.x;
      const sx=g.x+nx*normalOffset, sy=g.y+ny*normalOffset;
      if(force>7){
        arrow(sx,sy,sx+tu.x*force,sy+tu.y*force,{color:"#a83b34",width:5,head:15});
        const fx=sx+tu.x*force*.52;
        const fy=sy+tu.y*force*.52-56;
        canvasText("FUERZA",fx,fy,{font:'800 15px "Segoe UI",Arial,sans-serif',color:"#7e2925",bg:"rgba(255,247,238,.95)"});
        canvasText("disminuye",fx,fy+28,{font:'700 13px "Segoe UI",Arial,sans-serif',color:"#7e2925",bg:"rgba(255,247,238,.88)"});
      }else{
        canvasText("FUERZA = 0",g.x,g.y-82,{font:'800 15px "Segoe UI",Arial,sans-serif',color:"#7e2925",bg:"rgba(255,247,238,.95)"});
      }
    }
  }

  function updateTheta(t){
    if(state.mode==="held" || state.mode==="forces" || state.mode==="figure3" || state.mode==="usevsapply") return state.fixedTheta;
    if(state.mode==="rest") return state.fixedTheta;
    if(state.mode==="swingToEq"){
      const p=clamp((t-state.swingStart)/state.swingDuration,0,1);
      return state.fixedTheta*Math.cos((Math.PI/2)*p);
    }
    if(state.mode==="tangentialDemo"){
      const p=clamp((t-state.tangentialDemoStart)/state.swingDuration,0,1);
      return state.fixedTheta*Math.cos((Math.PI/2)*p);
    }
    if(state.mode==="equilibrium") return 0;
    if(state.mode==="fullSwing"){
      const p=clamp((t-state.fullSwingStart)/state.swingDuration,0,1);
      return state.fixedTheta*Math.cos(Math.PI*p);
    }
    return state.theta;
  }

  function render(now){
    const t=nowActive();
    state.theta=updateTheta(t);
    drawRoom();

    if(state.showFinalQuestion){ drawFinalQuestion(now); requestAnimationFrame(render); return; }
    if(state.showLengthCompare){ drawLengthComparison(now); requestAnimationFrame(render); return; }
    if(state.showExperimentalQuestion){ drawExperimentalQuestion(); requestAnimationFrame(render); return; }
    if(state.showPendulumBuild){ drawPendulumBuild(now); requestAnimationFrame(render); return; }
    if(state.showIdealPendulum){ drawIdealPendulum(now); requestAnimationFrame(render); return; }
    if(state.showReflectionScene){ drawReflectionScene(now); requestAnimationFrame(render); return; }

    const g=pendulumGeom(state.theta);
    drawChainAndLamp(g,now);

    if(state.showWind) drawWind(g,now);
    if(state.showForces) drawForcesAtExtreme(g,{withWind:state.mode==="held",parallelogram:state.showParallelogram});

    if(state.mode==="swingToEq"){
      const p=clamp((t-state.swingStart)/state.swingDuration,0,1);
      drawVelocityAndTangential(g,p);
    }
    if(state.mode==="tangentialDemo"){
      const p=clamp((t-state.tangentialDemoStart)/state.swingDuration,0,1);
      drawVelocityAndTangential(g,p);
    }
    if(state.showUnknownMagnitudes) drawEquilibriumUnknown(g);
    if(state.showVelocityAtEq) drawVelocityAtEquilibrium(g);
    if(state.showUseVsApply) drawUseVsApply();
    if(state.showFigure3) drawFigure3(g);

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  function updateRestartButton(){
    restartBtn.textContent = presentationEnded ? "REPETIR" : "REGRESAR";
  }

  function setControlsVisible(visible){
    controls.style.display = visible ? "flex" : "none";
  }

  function currentPlaybackMs(){
    return playbackOffsetMs + Math.max(0, nowActive()-presentationStartActive);
  }

  function markScene(index){
    currentSceneIndex=index;
    presentationEnded=false;
    if(!sceneTimeline.has(index)) sceneTimeline.set(index,currentPlaybackMs());
    updateRestartButton();
  }

  async function unlockControlsAfterMinute(localRunId,delayMs=60000){
    if(controlsUnlocked){ setControlsVisible(true); return; }
    try{
      await sleep(Math.max(0,delayMs));
      if(localRunId!==runId) return;
      controlsUnlocked=true;
      setControlsVisible(true);
    }catch(e){}
  }

  function sceneForOneMinuteBack(){
    const target=Math.max(0,currentPlaybackMs()-60000);
    let bestScene=0;
    let bestTime=-1;
    for(const [scene,time] of sceneTimeline.entries()){
      if(time<=target && time>=bestTime){ bestTime=time; bestScene=scene; }
    }
    return {scene:bestScene,time:Math.max(0,bestTime)};
  }

  async function runPresentation(startScene=0,startPlaybackMs=0){
    if(running) return;
    running=true; paused=false; totalPause=0; pauseStarted=0; runId++;
    const id=runId;
    let completed=false;
    presentationEnded=false;
    currentSceneIndex=startScene;
    playbackOffsetMs=startPlaybackMs;
    presentationStartActive=nowActive();
    updateRestartButton();
    overlay.style.display="none";
    pauseBtn.textContent="PAUSAR";
    startBtn.disabled=true;
    speechSynthesis.cancel();
    resetState();
    clearBoard();

    if(startScene===0 && startPlaybackMs===0){
      sceneTimeline.clear();
    }

    if(startPlaybackMs < 60000){
      controlsUnlocked=false;
      setControlsVisible(false);
      unlockControlsAfterMinute(id,60000-startPlaybackMs);
    }else{
      controlsUnlocked=true;
      setControlsVisible(true);
    }

    // La música nunca debe bloquear el arranque de la presentación.
    startMusic(startScene===0 && startPlaybackMs===0);

    try{
      await waitVoices();

      if(startScene <= 0){
        markScene(0);
        await sceneNarration({
          mode:"held", opts:{fixedTheta:.42,showWind:false,showForces:false,showParallelogram:false,showVelocity:false,showTangential:false,showUnknownMagnitudes:false,showUseVsApply:false,showFigure3:false},
          boardTitleText:"VOLVIENDO A LA LÁMPARA",
          boardItems:["La lámpara se mueve repetidamente de un lado a otro alrededor de una <strong>posición de equilibrio</strong>.","Nos habíamos quedado en el extremo al que la llevó el viento."],
          sceneText:"Volvemos al instante en que la lámpara está detenida en un extremo.",
          text:"Volviendo a la lámpara. Habíamos llegado a que se mueve repetidamente de un lado a otro alrededor de una posición de equilibrio. Y nos quedamos como la lámpara: detenidos en el punto hasta donde la llevó el viento cuando la separó de esa posición. Continúo con las preguntas, tratando de que estén bien formuladas.",
          captionText:"La lámpara está detenida, por un instante, en el extremo de su recorrido."
        });
      }

      if(startScene <= 1){
        markScene(1);
        await sceneNarration({
          mode:"held", opts:{fixedTheta:.42,showWind:true,showForces:false},
          boardTitleText:"INTERACCIÓN",
          boardItems:["El aire en movimiento y la lámpara <strong>interactúan</strong>.","El viento ejerce una fuerza y transfiere energía a la lámpara."],
          sceneText:"¿Qué ocurrió durante la interacción?",
          text:"El aire en movimiento y la lámpara interactuaron. La fuerza del viento llevó a la lámpara hasta la posición donde estuvo detenida durante un tiempo muy pequeño. ¿Qué ocurrió durante esa interacción? El viento ejerció una fuerza sobre la lámpara y le transfirió energía.",
          captionText:"Interacción: el viento ejerce una fuerza y transfiere energía."
        });
      }

      if(startScene <= 2){
        markScene(2);
        await sceneNarration({
          mode:"held", opts:{fixedTheta:.42,showWind:false,showForces:true,showParallelogram:false},
          boardTitleText:"MIENTRAS EL VIENTO ACTÚA",
          boardItems:["La lámpara permanece en reposo.","La suma de las fuerzas que actúan sobre ella es <strong>cero</strong>."],
          sceneText:"Tres fuerzas actúan y se compensan.",
          text:"Mientras el viento actuaba, la lámpara permanecía en reposo. Actuaban tres fuerzas: la tensión del hilo, la fuerza del campo gravitatorio y la fuerza del viento. Todas se compensaban.",
          captionText:"En reposo: las fuerzas se compensan."
        });
      }

      if(startScene <= 3){
        markScene(3);
        await sceneNarration({
          mode:"forces", opts:{fixedTheta:.42,showWind:false,showForces:true,showParallelogram:true},
          boardTitleText:"CUANDO CESA EL VIENTO",
          boardItems:[{text:"¿Cuál es ahora la suma de las fuerzas?",question:true},"La lámpara parte del reposo y comienza a moverse hacia la posición de equilibrio.","La fuerza resultante apunta en esa dirección y sentido."],
          sceneText:"La figura se construye con suma de vectores.",
          text:"Al cesar la acción del viento, desaparece una de las tres fuerzas. Si la lámpara estaba en reposo y comienza a moverse hacia la posición de equilibrio, la fuerza resultante tiene esa misma dirección y sentido. Una fotografía mental, más unos conocimientos elementales sobre suma de vectores, permiten representarlo como en la figura tres.",
          captionText:"Cesa el viento: aparece una fuerza resultante dirigida hacia el equilibrio."
        });
      }

      if(startScene <= 4){
        markScene(4);
        setMode("swingToEq",{fixedTheta:.42,showWind:false,showForces:false,showParallelogram:false,showVelocity:true,showTangential:false,swingStart:nowActive(),swingDuration:5400});
        board("OBSERVAR ANTES DE PREGUNTAR",[
          "Parte del reposo y <strong>va cada vez más rápido</strong>.",
          "Al pasar por la posición de equilibrio, el movimiento es tan rápido que cuesta captar ese instante.",
          "A veces las respuestas llegan primero que las preguntas."
        ]);
        label("Observe cómo cambia el movimiento entre el extremo y el equilibrio.");
        await speak("Sigo observando. Partiendo del reposo, la lámpara va cada vez más rápido. Lo veo con mis propios ojos: cuando pasa por la posición de equilibrio, apenas alcanzo a captar el instante preciso en que lo hace. No me he preguntado nada todavía, pero ya tengo una respuesta. A veces las respuestas llegan primero que las preguntas. Eso sucede cuando se observa bien.",{rate:.87,pitch:.86,captionText:"En este primer tramo, la lámpara va cada vez más rápido."});
        await sleep(500);
      }

      if(startScene <= 5){
        markScene(5);
        await sceneNarration({
          mode:"equilibrium", opts:{showVelocity:false,showTangential:false,showUnknownMagnitudes:false},
          boardTitleText:"AHORA LLEGA LA PREGUNTA",
          boardItems:[{text:"¿Por qué la lámpara va cada vez más rápido?",question:true},"Para que cambie su velocidad tiene que existir aceleración.","Si existe aceleración, existe una fuerza resultante."],
          sceneText:"¡Las leyes de Newton!",
          text:"Ya tengo la certeza, pero ahora llegó la pregunta: ¿por qué? Y no veo por qué. Pero no creo que necesite otro receso. ¡El receso! ¡Las leyes de Newton! Para que cambie su velocidad tiene que existir aceleración, y si hay aceleración hay fuerza resultante.",
          captionText:"Cambio de velocidad → aceleración → fuerza resultante.",
          rate:.84,pitch:.90
        });
      }

      if(startScene <= 6){
        markScene(6);
        await sceneNarration({
          mode:"forces", opts:{fixedTheta:.42,showForces:true,showParallelogram:true,showUnknownMagnitudes:false},
          boardTitleText:"REGRESO A LA FIGURA 3",
          boardItems:["Al cesar el viento quedan la tensión y la fuerza del campo gravitatorio.","Justo al comenzar el movimiento, la tensión compensa la componente de la fuerza gravitatoria que tiene la dirección del hilo.","Queda una resultante dirigida hacia la posición de equilibrio."],
          sceneText:"Regreso al instante inicial.",
          text:"Regreso a mi figura tres. Mientras el viento actuaba y la lámpara permanecía detenida, las tres fuerzas se compensaban. Al cesar el viento, las otras dos dejaron de compensarse. Justo cuando comienza el movimiento, la tensión compensa la componente de la fuerza del campo gravitatorio que tiene la dirección del hilo; queda una resultante dirigida hacia la posición de equilibrio.",
          captionText:"En el instante de partida, la resultante apunta hacia el equilibrio."
        });
      }

      if(startScene <= 7){
        markScene(7);
        await sceneNarration({
          mode:"equilibrium", opts:{showForces:false,showParallelogram:false,showUnknownMagnitudes:true},
          boardTitleText:"EN LA POSICIÓN DE EQUILIBRIO",
          boardItems:["Solo actúan dos fuerzas: tensión y fuerza del campo gravitatorio.","Tienen la misma dirección y sentidos opuestos.",{text:"¿Y sus valores?",question:true},"Sin conocerlos todavía, sabemos que su suma no tiene componente en la dirección del movimiento en ese instante."],
          sceneText:"La pregunta queda abierta: ¿y sus valores?",
          text:"Con mi imaginación hago ahora un análisis gráfico de lo que sucede cuando la lámpara pasa por la posición de equilibrio. Nada más hay dos fuerzas: la tensión del hilo y la fuerza del campo gravitatorio. Tienen la misma dirección y sentidos opuestos. ¿Y sus valores? No sé todavía cómo son. Pero sí puedo saber algo sin conocerlos: su suma no puede tener componente en la dirección en que se mueve la lámpara en ese instante.",
          captionText:"En el equilibrio: misma dirección, sentidos opuestos. ¿Y sus valores?",
          rate:.86
        });
      }

      if(startScene <= 8){
        markScene(8);
        setMode("tangentialDemo",{fixedTheta:.42,showForces:false,showUnknownMagnitudes:false,showVelocity:true,showTangential:true,tangentialDemoStart:nowActive(),swingDuration:6200});
        board("UNA RESPUESTA QUE PARECE EXTRAÑA",[
          "La componente de la fuerza resultante en la dirección del movimiento <strong>disminuye</strong>.",
          "Parte de un valor máximo y llega a <strong>cero</strong> en la posición de equilibrio.",
          "Durante ese mismo tramo, la lámpara va cada vez más rápido."
        ]);
        label("Observe simultáneamente la velocidad y la componente de la fuerza.");
        await speak("Entonces ya puedo responder la pregunta anterior. Desde que comenzó a moverse hasta llegar a la posición de equilibrio, la componente de la fuerza resultante en la dirección del movimiento fue disminuyendo: desde un valor máximo, cuando la velocidad era nula, hasta hacerse cero al pasar por la posición de equilibrio. Durante todo ese tramo, la lámpara fue cada vez más rápido.",{rate:.84,pitch:.85,captionText:"Velocidad creciente; componente de la fuerza en la dirección del movimiento, decreciente."});
        await sleep(600);
      }

      if(startScene <= 9){
        markScene(9);
        await sceneNarration({
          mode:"equilibrium", opts:{showVelocity:false,showTangential:false,showUnknownMagnitudes:false},
          boardTitleText:"DALE VUELTAS",
          boardItems:[{text:"¿Puede un cuerpo moverse cada vez más rápido mientras esa componente de la fuerza va disminuyendo hasta hacerse cero?",question:true},{text:"¿Esto contradice la segunda ley de Newton?",question:true},"Las dos afirmaciones son compatibles. Encontrar el porqué queda en manos del lector."],
          sceneText:"No responda de inmediato.",
          text:"Dale vueltas a esa respuesta, porque es absolutamente cierta. ¿Puede un cuerpo moverse cada vez más rápido mientras la componente de la fuerza resultante en la dirección de su movimiento va disminuyendo hasta hacerse cero? ¿Esto contradice la segunda ley de Newton? Te voy a dejar para que encuentres los dos porqués. Si los encuentras, puedes asegurar que estás aprendiendo a utilizar las leyes de Newton.",
          captionText:"Dos preguntas para pensar con las leyes de Newton.",
          rate:.82,pitch:.84
        });
      }

      if(startScene <= 10){
        markScene(10);
        await sceneNarration({
          mode:"usevsapply", opts:{fixedTheta:0,showUseVsApply:true,showUnknownMagnitudes:false,showVelocity:false,showTangential:false},
          boardTitleText:"UTILIZAR LAS LEYES",
          boardItems:["Fíjate: digo <strong>utilizar</strong>, no aplicar.","Nosotros utilizamos las leyes para interpretar lo que ocurre.","Quien las pone en acción es la propia naturaleza."],
          sceneText:"Una precisión importante de lenguaje.",
          text:"Una aclaración. Fíjate que digo utilizar las leyes de Newton, y no aplicar. Nosotros utilizamos las leyes para interpretar lo que ocurre; no somos quienes las hacemos cumplir. En ese sentido, quien las aplica es la propia naturaleza.",
          captionText:"Nosotros las utilizamos; la naturaleza las pone en acción.",
          rate:.88,pitch:.86,
          after:180
        });
      }

      if(startScene <= 11){
        markScene(11);
        await sceneNarration({
          mode:"figure3", opts:{fixedTheta:.42,showUseVsApply:false,showForces:false,showFigure3:true},
          boardTitleText:"FIGURA 3",
          boardItems:["Tensión + fuerza del campo gravitatorio → fuerza resultante.","La construcción vectorial resume el instante en que cesa la acción del viento."],
          sceneText:"Figura 3",
          text:"¿Cansado? Si quieres, hasta aquí. Relájate, falta poco.",
          captionText:"Relájate. Falta poco.",
          rate:.84,pitch:.86,
          after:0
        });
        setMusicVolume(0.28);
        await sleep(2000);
        setMusicVolume(baseMusicVolume);
      }

      if(startScene <= 12){
        markScene(12);
        setMode("fullSwing",{fixedTheta:.42,showFigure3:false,showVelocity:false,showVelocityAtEq:false,fullSwingStart:nowActive(),swingDuration:7600});
        board("PERO ME SURGE UNA DUDA",[
          {text:"¿Por qué atraviesa la posición de equilibrio si allí la componente de la fuerza en la dirección del movimiento es cero?",question:true},
          "Segunda ley: en ese instante, aceleración tangencial = <strong>0</strong>.",
          "Primera ley: para detenerla allí tendría que existir una fuerza que cambie su estado de movimiento."
        ]);
        label("La lámpara llega con velocidad y atraviesa la posición de equilibrio.");
        await speak("Pero me surge una duda: ¿por qué la lámpara continúa moviéndose cuando llega a la posición de equilibrio si la fuerza en la dirección del movimiento allí es cero? La respuesta se debe buscar en lo que recuerdo de las leyes de Newton. Primero, la segunda: si la suma de fuerzas en la dirección del movimiento es cero, la aceleración en esa dirección también es cero. Segundo, la primera: la lámpara tiene masa inercial y, por lo tanto, para cambiar su estado de movimiento, en este caso para detenerse, tendría que existir una fuerza en sentido contrario a su movimiento. Pero en la posición de equilibrio no existe esa fuerza. Por eso, la lámpara no tiene por qué detenerse allí y continúa su movimiento, atravesando la posición de equilibrio.",{rate:.84,pitch:.86,captionText:"En el equilibrio: aceleración tangencial cero, pero velocidad distinta de cero."});
        await sleep(500);
      }

      if(startScene <= 13){
        markScene(13);
        await sceneNarration({
          mode:"equilibrium", opts:{showVelocityAtEq:true,showUnknownMagnitudes:false,showFigure3:false},
          boardTitleText:"INERCIA EN EL EQUILIBRIO",
          boardItems:["Todo cuerpo tiende a mantener su estado de movimiento.","La lámpara llega al equilibrio con <strong>velocidad distinta de cero</strong>.","Sin una fuerza tangencial que la detenga en ese instante, continúa."],
          sceneText:"No confundamos fuerza cero en una dirección con velocidad cero.",
          text:"Atraviesa la posición de equilibrio porque, por la ley de inercia, si la lámpara estaba moviéndose, seguirá moviéndose mientras ninguna fuerza en sentido contrario cambie ese estado.",
          captionText:"Fuerza tangencial cero no significa velocidad cero.",
          rate:.85,pitch:.86
        });
      }

      if(startScene <= 14){
        markScene(14);
        await sceneNarration({
          mode:"equilibrium", opts:{showVelocityAtEq:false,showUnknownMagnitudes:true},
          boardTitleText:"LO QUE AÚN NO HE MEDIDO",
          boardItems:["En la dirección del movimiento: componente de la fuerza = <strong>0</strong>.","En la vertical actúan la tensión y la fuerza del campo gravitatorio.",{text:"¿Son iguales sus valores cuando pasa por el equilibrio? Habría que medirlos.",question:true}],
          sceneText:"Ahora aparece una nueva pregunta medible.",
          text:"Ya puedo explicar que en la posición de equilibrio del movimiento de una lámpara colgante no hay fuerza actuando en la dirección del movimiento, pero en ese punto está actuando la fuerza del campo gravitatorio y la tensión, ambas en dirección vertical; necesitaría medirlas para ver si son iguales.",
          captionText:"La descripción mejora cuando una pregunta puede convertirse en medición.",
          rate:.86,pitch:.86
        });
      }

      if(startScene <= 15){
        markScene(15);
        await sceneNarration({
          mode:"lengthCompare", opts:{showUnknownMagnitudes:false,showLengthCompare:true,comparisonStart:nowActive()},
          boardTitleText:"CAMBIAR UNA CARACTERÍSTICA",
          boardItems:[{text:"¿Qué sucede si el sostén es más corto o más largo?",question:true},"Para comparar necesito modificar <strong>una característica cada vez</strong>.","La lámpara del techo no es un sistema cómodo para medir y repetir."],
          sceneText:"Tres lámparas iguales, con tres longitudes distintas.",
          text:"Pero además me gustaría saber qué sucede si el sostén de la lámpara fuera más corto o más largo. Me parece que eso está complicado, porque tengo que acercarme más a la lámpara que está en el techo. ¿Cómo podría estudiar ese movimiento de una manera controlada, cambiando una característica cada vez y repitiendo las mediciones?",
          captionText:"Tres lámparas iguales: solo cambia la longitud del sostén.",
          rate:.85,pitch:.86
        });
      }

      if(startScene <= 16){
        markScene(16);
        await sceneNarration({
          mode:"experimentQuestion", opts:{showLengthCompare:false,showExperimentalQuestion:true},
          boardTitleText:"DEL FENÓMENO AL EXPERIMENTO",
          boardItems:["Buscar un sistema con un comportamiento parecido.","Observarlo de cerca.","Cambiar una característica cada vez.","Medir, repetir y comparar."],
          sceneText:"¿Qué necesito realmente para describir una oscilación?",
          text:"¿Qué tal si me buscara un dispositivo que se pareciera en su comportamiento a la lámpara, pero que pudiera hacer mediciones y observarlo desde más cerca? Juntos, tú y yo, estamos creando condiciones parecidas a las que existen alrededor de la lámpara para estudiar su movimiento oscilatorio. Ya no observaremos el fenómeno real, sino uno muy parecido, que podamos reproducir y controlar tantas veces como queramos. Al crear estas condiciones para observar lo que sucede, estamos realizando un experimento.",
          captionText:"Un experimento permite reproducir, controlar, medir y comparar.",
          rate:.86,pitch:.86,
          after:120
        });
      }

      if(startScene <= 17){
        markScene(17);
        await sceneNarration({
          mode:"pendulumBuild", opts:{showExperimentalQuestion:false,showPendulumBuild:true},
          boardTitleText:"CONSTRUYO UN SISTEMA",
          boardItems:["Cuerda de piano: <strong>1 mm</strong> de diámetro.","Esfera de hierro en un extremo.","Distancia desde el punto de suspensión hasta el centro de la esfera: <strong>1 m</strong>.","Ahora puedo medir y modificar el sistema con control."],
          sceneText:"Una versión accesible del movimiento de la lámpara.",
          text:"Y el sistema que nos proponemos construir es un modelo al que llamaremos péndulo simple. ¡Vaya! No solamente te estoy mostrando el camino para que aprendas a observar, sino que, además, ya puedes explicar con precisión qué es un modelo y cómo se construye. Así: coloco una esfera de hierro en un extremo de un hilo y cuelgo el otro de un soporte. Ahora puedo observar el movimiento de cerca, realizar mediciones y cambiar una característica cada vez.",
          captionText:"Construir el sistema es parte del proceso de modelar.",
          rate:.83,pitch:.86
        });
      }

      if(startScene <= 18){
        markScene(18);
        await sceneNarration({
          mode:"idealPendulum", opts:{showPendulumBuild:false,showIdealPendulum:true},
          boardTitleText:"DEL SISTEMA REAL AL MODELO IDEAL",
          boardItems:["La masa de la esfera se concentra en <strong>un punto</strong>.","El hilo se considera <strong>sin masa e inextensible</strong>.","Se desprecia la interacción con el aire.","El punto de suspensión se considera fijo.","Así obtenemos el <strong>péndulo simple</strong>."],
          sceneText:"Idealizar no es negar la realidad: es decidir qué considerar para estudiar una pregunta.",
          text:"Pero el sistema que acabo de construir todavía tiene muchos detalles: la esfera tiene tamaño, el hilo tiene masa, el aire interactúa con ellos y el soporte tampoco permanece absolutamente inmóvil. Para estudiarlo no necesito considerar todo al mismo tiempo. Lo más sencillo es considerar que toda la masa de la esfera está concentrada en un punto, que el hilo no tiene masa y no se estira, que podemos despreciar la interacción con el aire y que el punto de suspensión permanece fijo. Con estas condiciones hemos construido un modelo ideal llamado péndulo simple.",
          captionText:"Péndulo simple: una idealización construida para estudiar el movimiento.",
          rate:.84,pitch:.86
        });
      }

      if(startScene <= 19){
        markScene(19);
        await sceneNarration({
          mode:"reflectionScene", opts:{showIdealPendulum:false,showReflectionScene:true},
          boardTitleText:"TODO ES, NO ES LO MISMO",
          boardItems:["No busco un estudio profundo del péndulo.","A partir de ahora afinaremos las observaciones.","No es lo mismo <strong>observar una lámpara oscilando</strong> que <strong>oscilar en una lámpara observando</strong>."],
          sceneText:"Todo es, no es lo mismo.",
          text:"Pero mi interés no es realizar un estudio profundo del péndulo. Nos ha servido para abrir el camino y recordarnos algo esencial: todo es, no es lo mismo. A partir de ahora afinaremos las observaciones para comprender que no es lo mismo observar una lámpara oscilando que oscilar en una lámpara observando.",
          captionText:"Todo es, no es lo mismo.",
          rate:.85,pitch:.86
        });
      }

      label("");
      controlsUnlocked=true;
      setControlsVisible(true);
      completed=true;

    }catch(err){
      if(err.message!=="cancelled") console.error(err);
    }finally{
      if(id===runId){
        running=false;
        startBtn.disabled=false;
        presentationEnded=completed;
        updateRestartButton();
      }
    }
  }

  async function restart(){
    const wasEnded=presentationEnded;
    const back=wasEnded ? {scene:0,time:0} : sceneForOneMinuteBack();
    runId++;
    speechSynthesis.cancel();
    if(wasEnded) stopMusic();
    paused=false; totalPause=0; pauseStarted=0;
    pauseBtn.textContent="PAUSAR";
    running=false;
    presentationEnded=false;
    updateRestartButton();
    hideCaption(); label("");
    resetState();
    await new Promise(r=>setTimeout(r,80));
    if(wasEnded){
      controlsUnlocked=false;
      setControlsVisible(false);
      runPresentation(0,0);
    }else{
      runPresentation(back.scene,back.time);
    }
  }

  function exitPresentation(){
    runId++;
    speechSynthesis.cancel();
    stopMusic();
    running=false; paused=false; totalPause=0;
    presentationEnded=false;
    currentSceneIndex=0;
    controlsUnlocked=false;
    playbackOffsetMs=0;
    presentationStartActive=0;
    sceneTimeline.clear();
    updateRestartButton();
    setControlsVisible(false);
    hideCaption(); label(""); clearBoard();
    boardTitle.textContent="VOLVIENDO A LA LÁMPARA";
    resetState();
    overlay.style.display="flex";
  }

  function togglePause(){
    if(!running && !paused) return;
    if(!paused){
      paused=true;
      pauseStarted=performance.now();
      if("speechSynthesis" in window) speechSynthesis.pause();
      pauseMusic();
      pauseBtn.textContent="CONTINUAR";
    }else{
      const delta=performance.now()-pauseStarted;
      totalPause+=delta;
      paused=false;
      pauseStarted=0;
      if("speechSynthesis" in window) speechSynthesis.resume();
      resumeMusic();
      pauseBtn.textContent="PAUSAR";
    }
  }

  startBtn.addEventListener("click",()=>runPresentation(0,0));
  pauseBtn.addEventListener("click",togglePause);
  restartBtn.addEventListener("click",restart);
  exitBtn.addEventListener("click",exitPresentation);
})();
</script>
</body>
