<!DOCTYPE html>

<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a0f;font-family:Arial,Helvetica,sans-serif;color:#fff}body{user-select:none}

.corner{position:absolute;width:108px;height:108px;border:6px solid var(--red);z-index:40;opacity:.82;pointer-events:none}.tl{top:18px;left:18px;border-right:0;border-bottom:0}.br{right:18px;bottom:18px;border-left:0;border-top:0}.accent{position:absolute;top:24px;left:150px;width:160px;height:7px;border-radius:8px;background:var(--yellow);z-index:40}

#bigText{position:absolute;left:5%;right:34%;bottom:84px;padding:10px 16px;border-radius:11px;background:rgba(0,0,0,.46);font-size:clamp(17px,1.72vw,29px);line-height:1.24;text-align:center;font-weight:700;text-shadow:0 2px 9px #000;opacity:0;transform:translateY(8px);transition:.3s;z-index:18}#bigText.show{opacity:1;transform:none}.yellow{color:var(--yellow)}.cyan{color:#8ce8ff}.red{color:#ff8b8b}
#board{position:absolute;top:44px;right:34px;bottom:44px;width:min(30vw,420px);padding:25px 24px 22px;background:linear-gradient(rgba(255,255,255,.02),rgba(0,0,0,.07)),var(--board);border:16px solid #8c6239;border-radius:22px;box-shadow:0 18px 46px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.06);z-index:30}#board:after{content:"";position:absolute;inset:10px;border:1px dashed rgba(255,255,255,.1);border-radius:12px;pointer-events:none}#board h3{margin:0 0 13px;color:var(--chalk);font-size:clamp(22px,2.05vw,34px);line-height:1.1}#board hr{border:0;border-top:2px solid rgba(255,255,255,.16);margin:10px 0 15px}#board ul{margin:0;padding-left:22px}#board li{color:var(--chalk);font-size:clamp(15px,1.22vw,21px);line-height:1.36;margin:0 0 12px}.mini{position:absolute;left:23px;right:23px;bottom:16px;font-size:13px;color:#dfeadf;opacity:.8}
#progress{position:absolute;left:4%;right:34%;bottom:66px;height:4px;background:rgba(255,255,255,.16);z-index:22;border-radius:4px;overflow:hidden}#progressBar{height:100%;width:0;background:var(--yellow);transition:width .25s}
#controls{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:50;opacity:0;pointer-events:none;transition:.3s}#controls.show{opacity:1;pointer-events:auto}.btn{min-width:124px;padding:12px 18px;border-radius:13px;border:1px solid rgba(255,255,255,.18);background:rgba(17,22,28,.94);color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.35)}.primary{background:var(--yellow);color:#171717;border-color:var(--yellow)}.danger{background:var(--red);border-color:var(--red)}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:radial-gradient(circle at 40% 38%,#173149 0,#081018 44%,#020304 100%)}#card{width:min(790px,90vw);padding:44px;border-radius:24px;background:rgba(5,8,12,.84);border:1px solid rgba(255,255,255,.14);box-shadow:0 25px 80px rgba(0,0,0,.58)}#card h1{margin:0 0 12px;font-size:clamp(38px,5.5vw,70px);line-height:1}#card h1 span{color:var(--yellow)}#card p{font-size:18px;line-height:1.5;color:#dbe5ed}
@media(max-width:850px){#board{top:auto;left:3%;right:3%;bottom:86px;width:auto;height:31%;border-width:10px;padding:15px 18px}#board h3{font-size:21px}#board li{font-size:14px;margin-bottom:5px}#bigText{right:5%;bottom:39%}#progress{right:5%;bottom:37%}.mini{display:none}}
</style>
</head>
<body>
<div id="app"><div class="corner tl"></div><div class="corner br"></div><div class="accent"></div>
  <div id="stage"><canvas id="canvas"></canvas><div id="shade"></div><div id="tag"></div><div id="bigText"></div>
    <aside id="board"><h3 id="boardTitle">Observación</h3><hr><ul id="boardList"></ul><div class="mini">Ideas esenciales de la explicación</div></aside>
    <div id="progress"><div id="progressBar"></div></div>
  </div>
  <div id="controls"><button class="btn" id="backBtn">Regresar</button><button class="btn primary" id="pauseBtn">Pausar</button><button class="btn danger" id="exitBtn">Salir</button></div>
  <div id="start"><div id="card"><h1>¿Qué se <span>propaga</span>?</h1><button class="btn primary" id="startBtn">Iniciar</button></div></div>
  <audio id="music" src="onda.mp3" preload="auto" loop></audio>
</div>
<script>
(()=>{"use strict";
const MUSIC_HIGH=.12,MUSIC_LOW=.025,VOICE_RATE=.72,VOICE_PITCH=.94;
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),boardTitle=document.querySelector('#boardTitle'),boardList=document.querySelector('#boardList'),bigText=document.querySelector('#bigText'),tag=document.querySelector('#tag'),progressBar=document.querySelector('#progressBar'),controls=document.querySelector('#controls'),start=document.querySelector('#start'),startBtn=document.querySelector('#startBtn'),backBtn=document.querySelector('#backBtn'),pauseBtn=document.querySelector('#pauseBtn'),exitBtn=document.querySelector('#exitBtn'),music=document.querySelector('#music');
let W=0,H=0,dpr=1,animT=0,sceneStart=0,mode='water',running=false,paused=false,token=0,currentScene=0,audioCtx=null,musicGain=null,musicNodes=[];
const N={
intro:'¿Qué viaja? O, con mayor precisión: ¿Qué se propaga?',
water:'Volvamos al pequeño elemento de agua que imaginamos antes. Cuando la gota cae, el elemento de agua que recibe el impacto es perturbado y realiza varias oscilaciones, cada una de menor amplitud, como se observa en la animación. Al hacerlo, afecta a los elementos que tiene cerca y estos, a su vez, afectan a los siguientes.',
ropeSimilar:'Algo semejante sucede con el primer elemento de una cuerda cuando recibe una acción exterior y se separa de su posición de equilibrio.',
two:'Si pudiéramos seguir solamente el movimiento del elemento inicial del agua o el de la cuerda, observaríamos que ninguno se desplaza junto con la perturbación hasta regiones cada vez más alejadas, sino que cada uno se mueve alrededor de su propia posición de equilibrio. Sin embargo, cuando observamos el conjunto, vemos otra cosa: la perturbación aparece poco después en regiones vecinas y continúa alejándose del lugar donde se produjo. Tenemos, entonces, dos movimientos que conviene no confundir.',
question:'Los elementos del medio oscilan alrededor de sus posiciones de equilibrio, mientras la perturbación se propaga a través del medio. Pero esto todavía no responde completamente a nuestra pregunta: ¿qué se propaga? Si el elemento que fue perturbado primero no viaja junto con la perturbación, ¿cómo puede un cambio producido en un lugar llegar hasta otro más distante?',
neighbors:'Debido a las interacciones entre elementos vecinos, otros también se apartan de su estado de equilibrio. Al moverse, estos afectan a los siguientes y el proceso continúa. Así, lo que ocurre en una región puede producir, un poco después, un cambio en otra región vecina, sin que los elementos del medio tengan que desplazarse junto con ese cambio.',
work:'Para producir la perturbación, un agente externo ejerce una fuerza y transfiere energía al primer elemento. La fuerza produce el desplazamiento vertical: trabajo.',
energy:'El primer elemento no está aislado. Al desplazarse de su posición de equilibrio, interactúa con los elementos que tiene cerca y ejerce fuerzas sobre ellos. De esta manera, les transfiere parte de la energía que recibió. Estos, a su vez, interactúan con los siguientes. La perturbación es una alteración del estado del medio; junto con ella avanza la energía que se transmite de un elemento a otro.',
pulse:'Cuando la perturbación inicial se produce una sola vez, se genera un pulso. Podemos imaginarlo como una región perturbada del medio en la que, durante cierto tiempo, se encuentra parte de la energía entregada por el agente externo. A medida que el pulso avanza, esa energía pasa de unos elementos a otros. El elemento del medio no viaja junto con el pulso.',
waterAgain:'Observemos nuevamente varias gotas que caen, una después de otra, sobre el mismo lugar. Cada impacto produce un pulso grande seguido por otros cada vez más tenues.',
waterProfile:'Ahora observemos la superficie del agua de perfil, como si cada elemento del líquido fuera un oscilador vinculado con los elementos vecinos mediante un hilo elástico.',
waterRadial:'La gota cae en el centro y la perturbación se propaga hacia la derecha y hacia la izquierda. Si estuviéramos viendo la superficie desde arriba, observaríamos que el pulso se propaga radialmente a través de los elementos del agua. Su amplitud disminuye rápidamente porque la energía se distribuye en una región cada vez mayor.',
real:'En un medio real, parte de la energía puede transferirse al aire, transformarse en energía interna debido a procesos disipativos o distribuirse en regiones cada vez mayores. Por eso, la amplitud del pulso disminuye rápidamente a medida que se aleja del lugar donde se originó y el pulso casi desaparece antes de llegar al extremo derecho.',
ideal:'En nuestro modelo ideal de una cuerda suponemos que no existen mecanismos que disipen energía y que sus propiedades permanecen constantes. Así, el pulso puede propagarse sin que su amplitud disminuya progresivamente debido a pérdidas de energía.',
train:'Si la perturbación se repite una y otra vez, aparece un pulso detrás de otro. Se forma así un tren de pulsos.',
periodicIntro:'El fenómeno se vuelve especialmente interesante cuando la perturbación se produce periódicamente.',
periodic:'El período es el tiempo que demora una oscilación en repetirse; en este caso, el tiempo que demora una perturbación en repetirse. Si las condiciones del medio se mantienen aproximadamente constantes, cada nueva perturbación seguirá a la anterior conservando una separación regular. Tendremos una onda periódica y un movimiento ondulatorio periódico.',
endRope:'Podemos hacer una primera descripción de una onda como una perturbación que se propaga y mediante la cual se transporta energía, sin que los elementos del medio se desplacen junto con ella.',
endWater:'Esta descripción todavía no nos dice completamente qué es una onda. Falta mucho por saber de ellas y, en la medida en que aprendas más, probablemente descubrirás que el fenómeno es mucho más interesante de lo que parece a primera vista.'};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function board(title,items){boardTitle.textContent=title;boardList.innerHTML=items.map(x=>'<li>'+x+'</li>').join('')}
function text(html,on=true){bigText.innerHTML=html;bigText.classList.toggle('show',on)}function label(s){tag.textContent=s;tag.classList.toggle('show',!!s)}
function sleep(ms,my=token){return new Promise((res,rej)=>{let elapsed=0,last=performance.now();function step(now){if(my!==token)return rej(new DOMException('Cancelado','AbortError'));if(!paused)elapsed+=now-last;last=now;if(elapsed>=ms)return res();requestAnimationFrame(step)}requestAnimationFrame(step)})}
function voice(){const vs=speechSynthesis.getVoices(),es=vs.filter(v=>/^es/i.test(v.lang));return es.find(v=>/male|mascul|jorge|diego|pablo/i.test(v.name))||es.find(v=>/google|microsoft/i.test(v.name))||es[0]||vs[0]}
async function speak(s,my=token){const parts=s.match(/[^.!?¿]+(?:[.!?]+|$)/g)||[s];for(const part of parts){if(my!==token)throw new DOMException('Cancelado','AbortError');await new Promise((res,rej)=>{const u=new SpeechSynthesisUtterance(part.trim());u.lang='es-CO';u.rate=VOICE_RATE;u.pitch=VOICE_PITCH;u.voice=voice();u.onend=res;u.onerror=e=>e.error==='canceled'?rej(new DOMException('Cancelado','AbortError')):res();speechSynthesis.speak(u)});await sleep(260,my)}}
async function narrate(s,my=token){setMusic(MUSIC_LOW,.5);await speak(s,my);setMusic(MUSIC_HIGH,1)}
async function startMusic(){music.volume=MUSIC_HIGH;try{await music.play();return}catch(e){}audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();if(musicNodes.length)return;musicGain=audioCtx.createGain();musicGain.gain.value=0;musicGain.connect(audioCtx.destination);[110,164.81,220].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=i?'sine':'triangle';o.frequency.value=f;g.gain.value=i?0.08:0.05;o.connect(g).connect(musicGain);o.start();musicNodes.push(o,g)});setMusic(MUSIC_HIGH,1.4)}
function setMusic(v,t=.4){if(!music.paused)music.volume=Math.max(0,Math.min(1,v));if(musicGain){const n=audioCtx.currentTime;musicGain.gain.cancelScheduledValues(n);musicGain.gain.linearRampToValueAtTime(v,n+t)}}
function stopAll(){token++;speechSynthesis.cancel();setMusic(0,.25);music.pause();running=false}
function setMode(next){mode=next;sceneStart=animT}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function line(x1,y1,x2,y2,c='#fff',lw=2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.stroke()}
function area(){return{x:W*.045,y:H*.13,w:W*(W<850?.91:.64),h:H*(W<850?.48:.67)}}
function backdrop(){ctx.clearRect(0,0,W,H);const a=area(),g=ctx.createRadialGradient(a.x+a.w*.5,a.y+a.h*.5,10,a.x+a.w*.5,a.y+a.h*.5,a.w*.65);g.addColorStop(0,'rgba(21,85,119,.46)');g.addColorStop(1,'rgba(2,8,13,.08)');ctx.fillStyle=g;ctx.fillRect(a.x,a.y,a.w,a.h)}
function arrow(x1,y1,x2,y2,c='#f5c24c',lw=4){line(x1,y1,x2,y2,c,lw);const q=Math.atan2(y2-y1,x2-x1);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-14*Math.cos(q-.55),y2-14*Math.sin(q-.55));ctx.lineTo(x2-14*Math.cos(q+.55),y2-14*Math.sin(q+.55));ctx.fill()}
function pulseState(a){const cycle=7000,phase=(animT-sceneStart)%cycle,v=phase/cycle,sigma=a.w*.07,left=a.x+20,preIdeal=['ropeForce','noTranslate','energy','work','pulse','dissipate'].includes(mode),damping=preIdeal?Math.exp(-(mode==='dissipate'?4.8:3.1)*v):1;return{cycle,phase,v,sigma,center:left-2.05*sigma+v*(a.w+4.1*sigma),amp:a.h*.22*damping}}
function trainStates(a){const elapsed=animT-sceneStart,cycle=10000,events=[{at:0,duration:6500,amp:1,width:.07,force:1250},{at:2850,duration:4300,amp:.58,width:.045,force:650},{at:4750,duration:8000,amp:.38,width:.09,force:950}],out=[];for(let lap=-1;lap<=0;lap++)for(const e of events){const age=elapsed-(Math.floor(elapsed/cycle)+lap)*cycle-e.at,sigma=a.w*e.width;if(age>=0&&age<=e.duration)out.push({...e,age,sigma,center:a.x+20-2.05*sigma+(age/e.duration)*(a.w+4.1*sigma)})}return out}
function ropeY(x,a){const elapsed=animT-sceneStart,s=pulseState(a),left=a.x+20;let y=a.y+a.h*.54;if(mode==='finalRope')y+=s.amp*.55*Math.sin((x-left)*.042-elapsed*.005);else if(mode==='periodic'){const fraction=(elapsed%1800)/1800;y+=s.amp*.58*Math.sin((x-left)*.032-fraction*Math.PI*2)}else if(mode==='train')for(const p of trainStates(a))y-=s.amp*p.amp*Math.exp(-Math.pow((x-p.center)/p.sigma,2));else y-=s.amp*Math.exp(-Math.pow((x-s.center)/s.sigma,2));return y}
function drawClock(a,fraction,firstX){const x=firstX,y=a.y+a.h*.25,r=40,phase=fraction*Math.PI;ctx.fillStyle='rgba(255,255,255,.94)';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#cf2d2d';ctx.lineWidth=5;ctx.stroke();for(let i=0;i<=5;i++){const q=i*Math.PI/5;line(x+Math.sin(q)*29,y-Math.cos(q)*29,x+Math.sin(q)*34,y-Math.cos(q)*34,'#173149',2)}arrow(x,y,x+Math.sin(phase)*26,y-Math.cos(phase)*26,'#cf2d2d',3);ctx.fillStyle='#173149';ctx.font='700 12px Arial';ctx.textAlign='center';ctx.fillText((fraction*.5).toFixed(1).replace('.',',')+' s',x,y+15);ctx.fillStyle='#fff';ctx.font='700 17px Arial';ctx.fillText('0 a 0,5 s',x,y+r+23);ctx.textAlign='left'}
function forceVector(firstX,y,up,lw=4){if(up)arrow(firstX,y+48,firstX,y+9,'#cf2d2d',lw);else arrow(firstX,y-48,firstX,y-9,'#cf2d2d',lw)}
function drawHand(a,fraction,firstX){const base=a.y+a.h*.54,y=base-Math.sin(fraction*Math.PI*2)*a.h*.14,palmX=firstX-46,palmY=y+5;ctx.save();ctx.fillStyle='#f0b38e';ctx.strokeStyle='#8f563d';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(palmX,palmY,24,29,-.25,0,Math.PI*2);ctx.fill();ctx.stroke();for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(palmX-13+i*9,palmY-27-(i===1||i===2?5:0),6,18,-.12+i*.07,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.lineCap='round';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(palmX+18,palmY-5);ctx.lineTo(firstX-5,y);ctx.strokeStyle='#f0b38e';ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#8f563d';ctx.stroke();ctx.restore();const up=Math.cos(fraction*Math.PI*2)>=0;forceVector(firstX,y,up,4)}
function drawForce(a,firstX){const s=pulseState(a),half=s.cycle*(4.1*s.sigma/(a.w+4.1*s.sigma));if(s.phase>half)return;const fraction=s.phase/half,y=a.y+a.h*.54-Math.sin(fraction*Math.PI)*a.h*.19,up=fraction<.5;forceVector(firstX,y,up,4);ctx.fillStyle='#ff8b8b';ctx.font='700 18px Arial';ctx.fillText('Fuerza',firstX+17,y+(up?34:-30))}
function drawTrainForce(a,firstX){const elapsed=animT-sceneStart,cycle=10000,t=elapsed%cycle,events=[{at:0,duration:6500,amp:1,width:.07},{at:2850,duration:4300,amp:.58,width:.045},{at:4750,duration:8000,amp:.38,width:.09}];for(const e of events){const sigma=a.w*e.width,force=e.duration*(4.1*sigma/(a.w+4.1*sigma)),age=t-e.at;if(age<0||age>force)continue;const f=age/force,base=a.y+a.h*.54,len=36+e.amp*55,y=base-Math.sin(f*Math.PI)*len,up=f<.5;forceVector(firstX,y,up,3+e.amp*2);ctx.fillStyle='#ff8b8b';ctx.font=`700 ${14+e.amp*5}px Arial`;ctx.fillText('Fuerza',firstX+15,y+(up?30:-26));break}}
function drawRope(){const a=area(),left=a.x+20,right=a.x+a.w-20,step=Math.max(18,a.w/30),elapsed=animT-sceneStart,s=pulseState(a),onsetX=s.center+2.05*s.sigma,onsetIndex=Math.round((onsetX-left)/step);ctx.save();ctx.lineCap='round';ctx.beginPath();for(let x=left;x<=right;x+=3){const y=ropeY(x,a);x===left?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle='#b98543';ctx.lineWidth=9;ctx.stroke();ctx.strokeStyle='#f1c27d';ctx.lineWidth=3;ctx.stroke();for(let x=left,i=0;x<=right;x+=step,i++){const y=ropeY(x,a);ctx.beginPath();ctx.arc(x,y,5.5,0,Math.PI*2);ctx.fillStyle=mode==='energy'&&i===onsetIndex?'#ffe05d':'#d8b06c';ctx.fill();ctx.strokeStyle='#6d4725';ctx.lineWidth=1;ctx.stroke()}if(mode==='noTranslate'){const firstY=ropeY(left,a);arrow(left,firstY-82,left,firstY-18,'#ffffff',3);ctx.fillStyle='#ffffff';ctx.font='700 19px Arial';ctx.textAlign='center';ctx.fillText('No se traslada',left,firstY+42);ctx.textAlign='left'}if(mode==='train')drawTrainForce(a,left);else if(['ropeForce','work','pulse','energy','dissipate','ideal'].includes(mode))drawForce(a,left);if(mode==='energy'&&onsetIndex>=0&&left+onsetIndex*step<=right){const ex=left+onsetIndex*step,ey=ropeY(ex,a);arrow(ex,ey-72,ex,ey-16,'#cf2d2d',4);ctx.fillStyle='#ff8b8b';ctx.font='700 18px Arial';ctx.textAlign='center';ctx.fillText('Entrega de energía',ex,ey-84);ctx.textAlign='left'}if(mode==='periodic'){const fraction=(elapsed%1800)/1800;drawHand(a,fraction,left);drawClock(a,fraction,left)}ctx.restore()}
function drawWater(){const a=area(),cx=a.x+a.w*.48,base=a.y+a.h*.63,cycle=4400,t=(animT-sceneStart)%cycle,impact=1150;const grad=ctx.createLinearGradient(0,a.y,0,a.y+a.h);grad.addColorStop(0,'rgba(17,70,100,.1)');grad.addColorStop(1,'rgba(24,136,182,.5)');ctx.fillStyle=grad;ctx.fillRect(a.x,a.y,a.w,a.h);if(t>=impact){const age=t-impact,maxAge=cycle-impact;[1,.58,.28].forEach((strength,i)=>{const delayed=age-i*360;if(delayed<0)return;const r=(delayed/maxAge)*a.w*.46,alpha=Math.max(0,strength*(1-delayed/maxAge));ctx.beginPath();ctx.ellipse(cx,base,r,r*.22,0,0,Math.PI*2);ctx.strokeStyle=`rgba(123,224,255,${alpha})`;ctx.lineWidth=3+strength*5;ctx.stroke()});const dampedAmp=34*Math.exp(-age/720),elementY=base+dampedAmp*Math.sin(age*.014);ctx.fillStyle='#b9f0ff';ctx.beginPath();ctx.arc(cx,elementY,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.stroke()}if(t<impact){const dropY=a.y+25+(t/impact)*(base-a.y-25);ctx.fillStyle='#78dcff';ctx.beginPath();ctx.ellipse(cx,dropY,7,11,0,0,Math.PI*2);ctx.fill()}}
function waterProfileState(a){const cycle=5200,impact=950,t=(animT-sceneStart)%cycle,p=Math.max(0,Math.min(1,(t-impact)/(cycle-impact))),center=a.x+a.w*.5,distance=p*a.w*.46,sigma=a.w*.055,amp=a.h*.20*Math.exp(-4.2*p);return{cycle,impact,t,p,center,distance,sigma,amp}}
function waterProfileY(x,a,s){if(s.t<s.impact)return a.y+a.h*.58;const left=s.center-s.distance,right=s.center+s.distance;return a.y+a.h*.58-s.amp*.55*(Math.exp(-Math.pow((x-left)/s.sigma,2))+Math.exp(-Math.pow((x-right)/s.sigma,2)))}
function drawWaterProfile(){const a=area(),s=waterProfileState(a),base=a.y+a.h*.58,left=a.x+20,right=a.x+a.w-20,step=Math.max(18,a.w/31);ctx.fillStyle='rgba(20,119,164,.25)';ctx.fillRect(a.x,base,a.w,a.h*.32);ctx.beginPath();for(let x=left;x<=right;x+=3){const y=waterProfileY(x,a,s);x===left?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle='#70dcff';ctx.lineWidth=5;ctx.stroke();for(let x=left;x<=right;x+=step){const y=waterProfileY(x,a,s);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle='#b8eeff';ctx.fill();line(x,base,x,y,'rgba(255,255,255,.28)',1)}if(s.t<s.impact){const y=a.y+18+(s.t/s.impact)*(base-a.y-18);ctx.fillStyle='#8ce8ff';ctx.beginPath();ctx.ellipse(s.center,y,7,11,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#fff';ctx.font='700 19px Arial';ctx.fillText('Vista de perfil: propagación hacia ambos lados',a.x+32,a.y+42);if(s.t>=s.impact){ctx.fillStyle='#f5c24c';ctx.font='700 17px Arial';ctx.fillText('La energía se distribuye en un área cada vez mayor',a.x+32,a.y+a.h-28)}}
function drawWaterRadial(){const a=area(),cx=a.x+a.w*.5,cy=a.y+a.h*.5,maxR=Math.min(a.w*.44,a.h*.43),rings=14,baseR=Math.max(4,Math.min(8,a.w/125)),cycle=8500,t=(animT-sceneStart)%cycle,impact=900,age=t-impact,pulseStarts=[0,1300,2600],strengths=[1,.62,.34],ringDelay=185,oscTime=950,g=ctx.createRadialGradient(cx,cy,20,cx,cy,maxR*1.35);g.addColorStop(0,'#a9e3f6');g.addColorStop(.5,'#52acd4');g.addColorStop(1,'#176992');ctx.fillStyle=g;ctx.fillRect(a.x,a.y,a.w,a.h);for(let ring=0;ring<rings;ring++){const rad=ring===0?0:maxR*ring/(rings-1),count=ring===0?1:Math.max(12,Math.round(2*Math.PI*rad/(baseR*2.4)));let scale=1;if(age>=0){for(let p=0;p<pulseStarts.length;p++){const tau=age-pulseStarts[p]-ring*ringDelay;if(tau>=0&&tau<=oscTime){scale=1+.46*strengths[p]*Math.sin(tau/oscTime*Math.PI*2)*Math.exp(-tau/oscTime*.7);break}}}for(let j=0;j<count;j++){const q=count===1?0:j*Math.PI*2/count+(ring%2?.11:0),x=cx+Math.cos(q)*rad,y=cy+Math.sin(q)*rad,rr=Math.max(2,baseR*scale),dot=ctx.createRadialGradient(x-rr*.35,y-rr*.4,1,x,y,rr);dot.addColorStop(0,'#f5feff');dot.addColorStop(.3,'#a8e2f7');dot.addColorStop(.72,'#3d91bd');dot.addColorStop(1,'#123f5b');ctx.fillStyle=dot;ctx.shadowColor='rgba(211,247,255,.42)';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}if(t<impact){const q=t/impact,r=baseR*(.55+.45*q);ctx.strokeStyle=`rgba(240,253,255,${.25+.5*q})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,baseR*(1.8-.7*q),0,Math.PI*2);ctx.stroke();ctx.fillStyle='#d8f7ff';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#fff';ctx.font='700 19px Arial';ctx.fillText('Superficie vista desde arriba',a.x+30,a.y+38)}
function drawFinalWater(){const a=area(),cx=a.x+a.w*.5,cy=a.y+a.h*.62,elapsed=animT-sceneStart,period=3200,current=elapsed%period,impact=900;ctx.fillStyle='rgba(20,119,164,.3)';ctx.fillRect(a.x,a.y,a.w,a.h);for(let n=0;n<5;n++){const age=elapsed-impact-n*period;if(age<0)continue;[1,.55,.25].forEach((strength,i)=>{const delayed=age-i*260;if(delayed<0)return;const r=(delayed/(period*2.2))*a.w*.46;if(r>a.w*.49)return;ctx.beginPath();ctx.ellipse(cx,cy,r,r*.24,0,0,Math.PI*2);ctx.strokeStyle=`rgba(126,224,255,${Math.max(.06,strength*(1-r/(a.w*.5)))})`;ctx.lineWidth=3+strength*4;ctx.stroke()})}if(current<impact){const y=a.y+20+(current/impact)*(cy-a.y-20);ctx.fillStyle='#8ce8ff';ctx.beginPath();ctx.ellipse(cx,y,6,10,0,0,Math.PI*2);ctx.fill()}}
function varColor(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function draw(){backdrop();if(mode==='water')drawWater();else if(mode==='waterProfile')drawWaterProfile();else if(mode==='waterRadial')drawWaterRadial();else if(mode==='finalWater')drawFinalWater();else drawRope();requestAnimationFrame(draw)}requestAnimationFrame(draw);setInterval(()=>{if(!paused)animT+=50},50);

async t=>{setMode('energy');label('Energía');board('Lo que se transmite',['La flecha acompaña a cada elemento.','La energía pasa al elemento vecino.']);text('<span class="red">Entrega de energía</span> de un elemento al siguiente.');await narrate(N.energy,t)},

async t=>{setMode('periodic');label('Periodicidad');board('Intervalos iguales',['La mano completa una oscilación.','El reloj repite el mismo recorrido.','Ese intervalo es el período T.']);text('La perturbación se produce <span class="yellow">periódicamente</span>.');await narrate(N.periodicIntro,t);await narrate(N.periodic,t)},
async t=>{setMode('finalRope');label('Onda en una cuerda');board('Primera descripción',['Se propaga una perturbación.','Se transporta energía.','Los elementos no viajan con ella.']);text('Una perturbación que se propaga y mediante la cual se transporta energía.');await narrate(N.endRope,t);setMode('finalWater');label('Onda en el agua');text('Las ondas también se propagan sobre la superficie del agua.');await sleep(2500,t);await narrate(N.endWater,t);backBtn.textContent='Repetir';pauseBtn.style.display='none';setMusic(.05,1)}];
async function run(from=0){token++;const t=token;running=true;paused=false;pauseBtn.textContent='Pausar';pauseBtn.style.display='';backBtn.textContent='Regresar';try{for(let i=from;i<scenes.length;i++){currentScene=i;progressBar.style.width=((i+1)/scenes.length*100)+'%';await scenes[i](t);await sleep(350,t)}}catch(e){if(e.name!=='AbortError')console.error(e)}}
startBtn.onclick=()=>{start.style.display='none';controls.classList.add('show');startMusic();run(0)};
backBtn.onclick=()=>{speechSynthesis.cancel();if(currentScene===scenes.length-1&&backBtn.textContent==='Repetir')run(0);else run(Math.max(0,currentScene-1))};
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'Continuar':'Pausar';if(paused){speechSynthesis.pause();setMusic(.015,.2)}else{speechSynthesis.resume();setMusic(MUSIC_LOW,.3)}};
exitBtn.onclick=()=>{stopAll();controls.classList.remove('show');start.style.display='flex';progressBar.style.width='0';text('',false);label('');board('Observación',[])};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pauseBtn.click()});
