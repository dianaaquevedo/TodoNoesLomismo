<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una gota sobre la superficie del agua</title>
<style>
  :root{
    --yellow:#f5c24c;
    --red:#cf2d2d;
    --board:#1f4f37;
    --chalk:#f3f4ee;
    --cyan1:#def7ff;
    --cyan2:#7ed5ff;
    --cyan3:#1f79ad;
    --cyan4:#113652;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;font-family:Arial,Helvetica,sans-serif;color:white}
  body{user-select:none}
  #app{
    position:relative;width:100vw;height:100vh;overflow:hidden;
    background:
      radial-gradient(circle at 45% 35%, rgba(37,82,112,.38), transparent 35%),
      linear-gradient(180deg,#08111a 0%,#03070b 100%);
  }
  .corner{position:absolute;width:108px;height:108px;border:6px solid var(--red);z-index:35;opacity:.8;pointer-events:none}
  .corner.tl{top:18px;left:18px;border-right:none;border-bottom:none}
  .corner.br{right:18px;bottom:18px;border-left:none;border-top:none}
  .accent{position:absolute;top:24px;left:150px;width:160px;height:7px;background:var(--yellow);z-index:35;border-radius:8px}

  #stage{position:absolute;inset:0}
  #photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    opacity:0;
    transition:opacity .28s ease;
    transform:none;
    filter:saturate(1.03) contrast(1.01);
    border-radius:0;
  }
  #photo.visible{opacity:1}

  /* Secuencia inicial: las tres fotos quedan precargadas en capas separadas. */
  #openingPhotos{
    position:absolute;inset:0;z-index:2;display:none;overflow:hidden;
  }
  #openingPhotos .openingFrame{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center center;
    opacity:0;visibility:hidden;transition:none;
    filter:saturate(1.03) contrast(1.01);
  }
  #openingPhotos .openingFrame.active{opacity:1;visibility:visible}
  #shade{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg, rgba(0,0,0,.06) 0%, rgba(0,0,0,.08) 66%, rgba(0,0,0,.34) 100%),
      linear-gradient(180deg, rgba(0,0,0,.03), rgba(0,0,0,.12) 55%, rgba(0,0,0,.28));
    z-index:3;
  }
  #overlayCanvas,#modelCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}
  #modelCanvas{z-index:10;opacity:0;transition:opacity .5s}
  #modelCanvas.show{opacity:1}

  #bigText{
    position:absolute;
    left:6%;
    right:34%;
    bottom:82px;
    z-index:20;
    font-size:clamp(17px,1.75vw,29px);
    line-height:1.22;
    font-weight:700;
    text-align:center;
    padding:9px 15px;
    border-radius:10px;
    background:rgba(0,0,0,.34);
    text-shadow:0 2px 10px rgba(0,0,0,.85);
    opacity:0;
    transform:translateY(8px);
    transition:opacity .3s, transform .3s;
  }
  #bigText.show{opacity:1;transform:translateY(0)}
  #bigText .yellow{color:var(--yellow)}
  #bigText .red{color:#ff7d7d}
  #tag{
    position:absolute;left:6%;top:7%;z-index:20;
    padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.25);font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    opacity:0;transition:opacity .25s;
  }
  #tag.show{opacity:1}

  #board{
    position:absolute;top:44px;right:34px;bottom:44px;width:min(30vw,420px);z-index:30;
    background:
      linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.06)),
      var(--board);
    border:16px solid #8c6239;border-radius:22px;
    box-shadow:0 18px 46px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.06);
    padding:24px 24px 22px 24px;
  }
  #board::after{
    content:"";position:absolute;inset:10px;border:1px dashed rgba(255,255,255,.10);border-radius:12px;pointer-events:none;
  }
  #board h3{
    margin:0 0 14px 0;color:var(--chalk);font-size:clamp(22px,2.1vw,34px);line-height:1.1;
    font-weight:800;
  }
  #board hr{border:none;border-top:2px solid rgba(255,255,255,.16);margin:10px 0 14px}
  #board ul{margin:0;padding-left:22px}
  #board li{
    color:var(--chalk);font-size:clamp(16px,1.26vw,22px);line-height:1.38;margin:0 0 12px 0;
  }
  #board .mini{
    position:absolute;left:22px;right:22px;bottom:16px;color:#dfeadf;
    font-size:13px;line-height:1.35;opacity:.85;
  }

  #controls{
    position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
    display:flex;gap:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;
  }
  #controls.show{opacity:1;pointer-events:auto}
  .btn{
    min-width:124px;padding:12px 18px;border:none;border-radius:13px;font-size:17px;font-weight:800;
    cursor:pointer;background:rgba(17,22,28,.92);color:white;border:1px solid rgba(255,255,255,.18);
    box-shadow:0 6px 24px rgba(0,0,0,.35);
  }
  .btn.primary{background:var(--yellow);color:#161616;border-color:var(--yellow)}
  .btn.danger{background:var(--red);border-color:var(--red)}

  #startScreen{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;
    background:radial-gradient(circle at 40% 38%, #173149 0%, #081018 42%, #020304 100%);
  }
  #startCard{
    width:min(780px,90vw);padding:42px;border-radius:24px;background:rgba(5,8,12,.82);
    border:1px solid rgba(255,255,255,.14);box-shadow:0 25px 80px rgba(0,0,0,.55);
  }
  #startCard h1{margin:0 0 14px;font-size:clamp(32px,5vw,62px);line-height:1}
  #startCard h1 span{color:var(--yellow)}
  #startCard p{font-size:18px;line-height:1.5;color:#dbe5ed}
  #startBtn{font-size:20px;padding:14px 24px}
  #audioNotice{margin-top:16px;font-size:14px;color:#bac7d1}
  #audioPickerWrap{margin-top:12px;display:none}
  #audioPicker{color:white}
  .mini2{font-size:13px;color:#9cb1c0;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div class="corner tl"></div><div class="corner br"></div><div class="accent"></div>

  <div id="stage">
    <img id="photo" src="gota1.png" alt="Secuencia de una gota de agua">
    <div id="openingPhotos" aria-hidden="true">
      <img class="openingFrame" src="gota1.png" alt="">
      <img class="openingFrame" src="gota2.png" alt="">
      <img class="openingFrame" src="gota3.png" alt="">
    </div>
    <div id="shade"></div>
    <canvas id="overlayCanvas"></canvas>
    <canvas id="modelCanvas"></canvas>
    <div id="tag">Perturbación</div>
    <div id="bigText"></div>

    <aside id="board">
      <h3 id="boardTitle">Observación</h3>
      <hr>
      <ul id="boardList"></ul>
      <div class="mini">Resumen de la explicación</div>
    </aside>
  </div>

  <div id="controls">
    <button class="btn" id="backBtn">Regresar</button>
    <button class="btn primary" id="pauseBtn">Pausar</button>
    <button class="btn danger" id="exitBtn">Salir</button>
  </div>

  <div id="startScreen">
    <div id="startCard">
      <h1>Una <span>gota</span> sobre la superficie del agua</h1>
      <button class="btn primary" id="startBtn">Iniciar</button>
    </div>
  </div>

  function resizeCanvases(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for(const c of [overlayCanvas, modelCanvas]){
      c.width = Math.floor(innerWidth*dpr);
      c.height = Math.floor(innerHeight*dpr);
      c.style.width = innerWidth+"px";
      c.style.height = innerHeight+"px";
    }
    octx.setTransform(dpr,0,0,dpr,0,0);
    mctx.setTransform(dpr,0,0,dpr,0,0);

  function abortError(){ const e = new Error("aborted"); e.name = "AbortError"; return e; }

  async function wait(ms, token=runToken){
    let remaining = ms;
    let last = performance.now();
    while(remaining > 0){
      if(token !== runToken) throw abortError();
      await new Promise(r => setTimeout(r, 35));
      const now = performance.now();
      if(!paused) remaining -= (now-last);
      last = now;
    }
  }

  async function fadeMusic(target, duration=300){
    const start = Number.isFinite(music.volume) ? music.volume : 0;
    const steps = 12;
    for(let i=1;i<=steps;i++){
      music.volume = Math.max(0, Math.min(1, start + (target-start)*(i/steps)));
      await new Promise(r=>setTimeout(r, duration/steps));
    }
  }

  function pickVoice(){
    const voices = speechSynthesis.getVoices();
    const preferred = [/Pablo/i,/Jorge/i,/Diego/i,/Carlos/i,/Andres/i,/Andrés/i,/es[-_ ]CO/i,/Spanish.*Colombia/i];
    for(const rx of preferred){
      const v = voices.find(v => rx.test(v.name) || rx.test(v.lang));
      if(v) return v;
    }
    return voices.find(v => /^es/i.test(v.lang)) || voices[0] || null;
  }

  function cancelSpeech(){
    if(currentSpeakReject){
      try{ currentSpeakReject(abortError()); }catch{}
      currentSpeakReject = null;
    }
    if(currentOpeningReject){
      try{ currentOpeningReject(abortError()); }catch{}
      currentOpeningReject = null;
    }
    openingQuestionAudio.pause();
    openingQuestionAudio.currentTime = 0;
    openingWasPlaying = false;
    if("speechSynthesis" in window) speechSynthesis.cancel();
  }

  // Better narration: split long text at punctuation for smoother audio
  function splitText(text){
    return text.split(/(?<=[\.\?\!;:])\s+/).filter(Boolean);
  }

  async function speak(text, opts={}, token=runToken){
    if(!("speechSynthesis" in window)){
      const est = Math.max(1500, text.split(/\s+/).length * 370);
      await wait(est,token);
      return;
    }
    const parts = splitText(text);
    for(const part of parts){
      await new Promise((resolve,reject)=>{
        if(token !== runToken) return reject(abortError());
        const u = new SpeechSynthesisUtterance(part);
        u.lang = "es-CO";
        u.rate = opts.rate ?? VOICE_RATE;
        u.pitch = opts.pitch ?? VOICE_PITCH;
        u.volume = opts.volume ?? 1;
        const v = pickVoice();
        if(v) u.voice = v;
        let done = false;
        const finish = () => {
          if(done) return;
          done = true;
          if(currentSpeakReject === reject) currentSpeakReject = null;
          if(token !== runToken) reject(abortError()); else resolve();
        };
        u.onend = finish;
        u.onerror = finish;
        currentSpeakReject = reject;
        speechSynthesis.speak(u);
      });
      await wait(opts.gapAfter ?? 120,token);
    }
  }

  async function narration(text, opts={}, token=runToken){
    await fadeMusic(MUSIC_LOW,220);
    await speak(text,opts,token);
  }

  async function speakOpeningQuestion(token=runToken){
    await fadeMusic(MUSIC_LOW,220);

    // Usa la grabación real, limpia y recortada, para conservar exactamente
    // la entonación de «Habrá» y la caída final de «sentidos».
    openingQuestionAudio.pause();
    openingQuestionAudio.currentTime = 0;

    await new Promise((resolve,reject)=>{
      if(token !== runToken) return reject(abortError());

      let done = false;
      const finish = () => {
        if(done) return;
        done = true;
        openingQuestionAudio.onended = null;
        openingQuestionAudio.onerror = null;
        if(currentOpeningReject === reject) currentOpeningReject = null;
        openingWasPlaying = false;
        if(token !== runToken) reject(abortError()); else resolve();
      };

      currentOpeningReject = reject;
      openingWasPlaying = true;
      openingQuestionAudio.onended = finish;
      openingQuestionAudio.onerror = finish;
      openingQuestionAudio.play().catch(finish);
    });

    await wait(90,token);
  }

  async function speakFinalQuestions(token=runToken){
    await fadeMusic(MUSIC_LOW,220);

    // Una sola locución continua: sin cortes ni pausas internas.
    // El énfasis interrogativo recae en QUÉ y en la idea de propagación.
    await speak(
      "¿QUÉ se propaga?",
      {
        rate: 0.70,
        pitch: 1.06,
        volume: 1,
        gapAfter: 0
      },
      token
    );

  async function runPulseCycle(token=runToken){
    modelState.mode = "pulses";
    modelState.dropTime = simTime;
    modelState.start = simTime + 1.60;
    modelState.settled = false;

    while(!modelState.settled){
      if(token !== runToken) throw abortError();
      await wait(150,token);
    }
    await wait(300,token);
  }

  const photoCache = new Map();

  function preloadOnePhoto(src){
    if(photoCache.has(src)) return photoCache.get(src);

    const p = new Promise(resolve=>{
      const img = new Image();
      let settled = false;
      const finish = ok => {
        if(settled) return;
        settled = true;
        resolve(ok);
      };
      img.onload = () => finish(true);
      img.onerror = () => finish(false);
      img.src = src;
      if(img.complete && img.naturalWidth > 0) finish(true);
    });

    photoCache.set(src,p);
    return p;
  }

  function openingFrameReady(img){
    if(img.complete && img.naturalWidth > 0) return Promise.resolve(true);
    return new Promise(resolve=>{
      let done = false;
      const finish = ok => {
        if(done) return;
        done = true;
        img.removeEventListener("load",onLoad);
        img.removeEventListener("error",onError);
        resolve(ok);
      };
      const onLoad = () => finish(true);
      const onError = () => finish(false);
      img.addEventListener("load",onLoad,{once:true});
      img.addEventListener("error",onError,{once:true});
      // Evita bloquear la locución si algún archivo tarda demasiado.
      setTimeout(()=>finish(img.complete && img.naturalWidth > 0),1800);
    });
  }

  async function preloadSequencePhotos(token=runToken){
    if(token !== runToken) throw abortError();
    // Estas tres etiquetas ya empezaron a cargar desde que se abrió el HTML.
    await Promise.all(openingFrames.map(openingFrameReady));
    if(token !== runToken) throw abortError();
  }

  function showOpeningFrame(i, token=runToken){
    if(token !== runToken) throw abortError();

    // Durante la apertura solo se usan las tres capas precargadas.
    photo.classList.remove("visible");
    openingPhotos.style.display = "block";
    openingFrames.forEach((frame,k)=>frame.classList.toggle("active",k===i));

    // Fuerza el repintado del navegador antes de iniciar el tiempo del fotograma.
    void openingPhotos.offsetWidth;
    overlayState.mode = "none";
    overlayState.label = "";
    overlayState.start = simTime;

  function closeOpeningPhotos(lastIndex=2){
    openingFrames.forEach(frame=>frame.classList.remove("active"));
    openingPhotos.style.display = "none";

    // Deja la última fotografía también en la etiqueta usada por el resto
    // de la animación para que el cambio de sistema sea imperceptible.
    photo.style.transition = "none";
    photo.src = photos[lastIndex];
    photo.classList.remove("photo1","photo2","photo3");
    photo.classList.add("photo"+(lastIndex+1),"visible");
    void photo.offsetWidth;
    photo.style.transition = "opacity .28s ease";
  }

  async function playOpeningPhotoSequence(token=runToken){
    await preloadSequencePhotos(token);

    // 1. Primera pasada: 1 segundo por fotografía.
    for(let i=0;i<3;i++){
      showOpeningFrame(i,token);
      await wait(1000,token);
    }

    // 2. Segunda pasada: 1/2 segundo por fotografía.
    for(let i=0;i<3;i++){
      showOpeningFrame(i,token);
      await wait(500,token);
    }

    // 3. Tercera pasada: 1/4 de segundo por fotografía.
    for(let i=0;i<3;i++){
      showOpeningFrame(i,token);
      await wait(250,token);
    }

    // 4. Cuarta pasada: 1/12 de segundo por fotografía (~83,33 ms).
    for(let i=0;i<3;i++){
      showOpeningFrame(i,token);
      await wait(1000/12,token);
    }

    // La tercera foto permanece visible mientras termina la locución inicial.
    showOpeningFrame(2,token);
  }

  async function showPhoto(i, token=runToken, hold=0, label=false){
    // La secuencia inicial ya terminó; desde aquí vuelve a usarse la foto normal.
    openingFrames.forEach(frame=>frame.classList.remove("active"));
    openingPhotos.style.display = "none";
    // Para el resto de la animación se conserva la presentación suave normal.
    photo.style.transition = "opacity .28s ease";
    photo.classList.remove("visible","photo1","photo2","photo3");
    await wait(120,token);

    const src = photos[i];
    await preloadOnePhoto(src);
    if(token !== runToken) throw abortError();

    photo.src = src;
    photo.classList.add("photo"+(i+1));
    photo.classList.add("visible");

    overlayState.mode = "none";
    overlayState.label = "";
    overlayState.start = simTime;

    if(hold) await wait(hold,token);

  function drawLabel(ctx, w, h, text){
    const centerX = w*0.34;
    const y = h - 132;
    ctx.save();
    ctx.font = "700 22px Arial";
    const padX = 14;
    const tw = ctx.measureText(text).width;
    const bw = tw + padX*2, bh = 38;
    const x = centerX - bw/2;
    ctx.fillStyle="rgba(0,0,0,.34)";
    ctx.beginPath();
    roundRect(ctx,x,y,bw,bh,10);
    ctx.fill();
    ctx.fillStyle="#ffffff";
    ctx.textAlign="center";
    ctx.fillText(text, centerX, y+26);
    ctx.restore();
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawOverlay(){
    const w = innerWidth, h = innerHeight;
    octx.clearRect(0,0,w,h);

    if(overlayState.mode === "osc"){
      // Bolita alineada con la ondulación principal de gota2.png
      const cx = w*0.545, cy = h*0.30;
      const t = simTime - overlayState.start;

      // Tres oscilaciones con amplitud decreciente y luego reposo.
      const period = 0.82;
      let y = 0;
      let localAmp = 0;

      if(t < period){
        localAmp = 22;
        y = localAmp * Math.sin((2*Math.PI*t)/period);
      }else if(t < 2*period){
        localAmp = 11;
        y = localAmp * Math.sin((2*Math.PI*(t-period))/period);
      }else if(t < 3*period){
        localAmp = 5.5;
        y = localAmp * Math.sin((2*Math.PI*(t-2*period))/period);
      }else{
        localAmp = 0;
        y = 0;
      }

      // movimiento desordenado local, también decreciente
      const chaosScale = localAmp > 0 ? (localAmp/22) : 0;
      for(let i=0;i<18;i++){
        const ang = i*0.7 + t*2.2;
        const rr = 28 + 9*Math.sin(t*2.6+i);
        const px = cx + Math.cos(ang)*(rr + chaosScale*7*Math.sin(t*4+i));
        const py = cy + Math.sin(ang*1.4)*(8 + chaosScale*2.5*Math.cos(i+t*3));
        octx.fillStyle = `rgba(160,230,255,${(0.03 + 0.11*chaosScale)*(0.6 + 0.4*Math.sin(i+t*3.1))})`;
        octx.beginPath();
        octx.arc(px, py+y*0.18, Math.max(0, 5 + chaosScale*(4*Math.sin(i*1.9+t*3.4))), 0, Math.PI*2);
        octx.fill();
      }

      // pequeñas ondulaciones locales
      octx.strokeStyle = "rgba(220,248,255,.5)";
      octx.lineWidth = 2;
      for(let k=0;k<4;k++){
        const rx = 46 + k*22 + chaosScale*5*Math.sin(t*5+k);
        const ry = 13 + k*5 + chaosScale*2*Math.cos(t*4+k);
        octx.beginPath();
        octx.ellipse(cx, cy+y*0.10, rx, ry, 0, 0, Math.PI*2);
        octx.stroke();
      }

      // bolita
      const sphereY = cy + y;
      const ballR = 34;
      const grad = octx.createRadialGradient(cx-ballR*.38,sphereY-ballR*.42,5,cx,sphereY,ballR);
      grad.addColorStop(0, "#f3fdff");
      grad.addColorStop(.28, "#9fdcff");
      grad.addColorStop(.68, "#397aaf");
      grad.addColorStop(1, "#153751");
      octx.fillStyle = grad;
      octx.shadowColor = "rgba(145,217,255,.8)";
      octx.shadowBlur = 24;
      octx.beginPath(); octx.arc(cx,sphereY,ballR,0,Math.PI*2); octx.fill();
      octx.shadowBlur = 0;

      // línea local del agua bajo la bolita
      octx.strokeStyle="rgba(230,248,255,.65)";
      octx.lineWidth=3;
      octx.beginPath(); octx.ellipse(cx, cy+40, 70, 20, 0, 0, Math.PI*2); octx.stroke();
    }
  }


  function drawTopModel(w,h){
    const cx = w*0.34;
    const cy = h*0.47;
    const baseR = Math.max(8, Math.min(12, w/118));

    // Fondo: superficie de agua vista desde arriba.
    const bg = mctx.createRadialGradient(cx,cy,20,cx,cy,Math.max(w,h)*0.72);
    bg.addColorStop(0,"rgba(180,232,250,1)");
    bg.addColorStop(.42,"rgba(104,194,231,1)");
    bg.addColorStop(1,"rgba(33,132,188,1)");
    mctx.fillStyle = bg;
    mctx.fillRect(0,0,w,h);

    // Textura muy suave del agua; sin dibujar circunferencias físicas.
    mctx.save();
    mctx.globalAlpha = .18;
    for(let i=0;i<10;i++){
      const yy = h*(0.12+i*0.085);
      mctx.strokeStyle="rgba(235,252,255,.55)";
      mctx.lineWidth=1.2;
      mctx.beginPath();
      for(let x=0;x<w*0.68;x+=18){
        const y = yy + Math.sin(x*.025+i)*2.2;
        if(x===0)mctx.moveTo(x,y); else mctx.lineTo(x,y);
      }
      mctx.stroke();
    }
    mctx.restore();

    // Bolitas distribuidas en muchas circunferencias imaginarias,
    // ocupando prácticamente toda la zona de simulación de la izquierda.
    const maxRad = Math.min(w*0.30,h*0.43);
    const ringCount = 14;
    const ringRadii = [];
    const counts = [];

    for(let ring=0; ring<ringCount; ring++){
      const rad = ring===0 ? 0 : maxRad*(ring/(ringCount-1));
      ringRadii.push(rad);

      if(ring===0){
        counts.push(1);
      }else{
        // La cantidad aumenta con el radio para que la superficie
        // se vea realmente llena y no queden huecos grandes.
        const circumference = 2*Math.PI*rad;
        const spacing = baseR*2.45;
        counts.push(Math.max(10, Math.round(circumference/spacing)));
      }
    }

    const now = simTime;
    const impactAge = now - modelState.topImpact;

    // Tres pulsos. Cada uno es más débil que el anterior.
    const pulseStarts = [0, 1.45, 2.90];
    const pulseStrength = [1.0, 0.68, 0.42];
    const ringDelay = 0.18;
    const cycle = 1.02;

    function pulseScale(ringIndex){
      if(impactAge < 0) return 1;
      let scale = 1;

      for(let p=0;p<pulseStarts.length;p++){
        const tau = impactAge - pulseStarts[p] - ringIndex*ringDelay;
        if(tau >= 0 && tau <= cycle){
          const a = pulseStrength[p];

          // 1 -> pequeño (se hunde) -> normal -> grande (sube) -> normal.
          if(tau < cycle*.25){
            const q=tau/(cycle*.25);
            scale = 1 - (0.42*a)*q;
          }else if(tau < cycle*.50){
            const q=(tau-cycle*.25)/(cycle*.25);
            scale = 1-(0.42*a)*(1-q);
          }else if(tau < cycle*.75){
            const q=(tau-cycle*.50)/(cycle*.25);
            scale = 1+(0.38*a)*q;
          }else{
            const q=(tau-cycle*.75)/(cycle*.25);
            scale = 1+(0.38*a)*(1-q);
          }
          break;
        }
      }
      return scale;
    }

    // Dibuja todas las bolitas.
    for(let ring=0; ring<ringRadii.length; ring++){
      const rad = ringRadii[ring];
      const count = counts[ring];

      for(let j=0;j<count;j++){
        const ang = count===1 ? 0 : (Math.PI*2*j/count) + (ring%2 ? 0.12 : 0);
        const x = cx + Math.cos(ang)*rad;
        const y = cy + Math.sin(ang)*rad;
        const sc = pulseScale(ring);
        const rr = baseR*sc;

        const grad = mctx.createRadialGradient(
          x-rr*.35,y-rr*.40,2,
          x,y,Math.max(2,rr)
        );
        grad.addColorStop(0,"rgba(244,253,255,.98)");
        grad.addColorStop(.26,"rgba(164,226,251,.98)");
        grad.addColorStop(.67,"rgba(53,139,190,.98)");
        grad.addColorStop(1,"rgba(15,62,91,.98)");

        mctx.fillStyle=grad;
        mctx.shadowColor="rgba(210,247,255,.48)";
        mctx.shadowBlur=8;
        mctx.beginPath();
        mctx.arc(x,y,Math.max(2,rr),0,Math.PI*2);
        mctx.fill();
        mctx.shadowBlur=0;
      }
    }

    // Gota vista desde arriba acercándose al centro.
    // Se hace levemente mayor al aproximarse para hacer perceptible la caída.
    const fallAge = now - modelState.topStart;
    const fallTime = Math.max(.01, modelState.topImpact-modelState.topStart);

    if(fallAge >= 0 && fallAge <= fallTime){
      const q = Math.max(0,Math.min(1,fallAge/fallTime));
      const dropR = baseR*(0.55 + 0.45*q);
      const haloR = baseR*(1.8 - 0.75*q);

      mctx.save();
      mctx.strokeStyle=`rgba(232,251,255,${0.18+0.45*q})`;
      mctx.lineWidth=2;
      mctx.beginPath();
      mctx.arc(cx,cy,haloR,0,Math.PI*2);
      mctx.stroke();

      const dg=mctx.createRadialGradient(cx-dropR*.35,cy-dropR*.4,2,cx,cy,dropR);
      dg.addColorStop(0,"#f4feff");
      dg.addColorStop(.35,"#b9ebff");
      dg.addColorStop(.78,"#3e8dbf");
      dg.addColorStop(1,"#144866");
      mctx.fillStyle=dg;
      mctx.shadowColor="rgba(225,250,255,.75)";
      mctx.shadowBlur=16;
      mctx.beginPath();
      mctx.arc(cx,cy,dropR,0,Math.PI*2);
      mctx.fill();
      mctx.restore();
    }

    // Marca el final cuando el tercer pulso pasó por el último anillo.
    const endTime = pulseStarts[2] + (ringRadii.length-1)*ringDelay + cycle + .55;
    if(impactAge > endTime){
      modelState.topSettled = true;
    }
  }


  function smooth01(x){
    x=Math.max(0,Math.min(1,x));
    return x*x*(3-2*x);
  }

  function drawWaterBase(w,h, topView=false){
    if(topView){
      const cx=w*0.34, cy=h*0.48;
      const g=mctx.createRadialGradient(cx,cy,10,cx,cy,Math.max(w,h)*0.72);
      g.addColorStop(0,"#bfeaff");
      g.addColorStop(.45,"#69c6ec");
      g.addColorStop(1,"#247fb4");
      mctx.fillStyle=g; mctx.fillRect(0,0,w,h);
      mctx.save(); mctx.globalAlpha=.20;
      for(let i=0;i<12;i++){
        const yy=h*(.08+i*.075);
        mctx.strokeStyle="rgba(245,254,255,.72)"; mctx.lineWidth=1.2;
        mctx.beginPath();
        for(let x=0;x<w*.68;x+=16){
          const y=yy+Math.sin(x*.022+i*1.7)*2.4;
          if(x===0)mctx.moveTo(x,y); else mctx.lineTo(x,y);
        }
        mctx.stroke();
      }
      mctx.restore();
    }else{
      const sky=mctx.createLinearGradient(0,0,0,h*.48);
      sky.addColorStop(0,"#edf7fc"); sky.addColorStop(1,"#d6eef9");
      mctx.fillStyle=sky; mctx.fillRect(0,0,w,h*.50);
      const water=mctx.createLinearGradient(0,h*.46,0,h);
      water.addColorStop(0,"#c9eafb"); water.addColorStop(.48,"#73c8eb"); water.addColorStop(1,"#2a8fc5");
      mctx.fillStyle=water; mctx.fillRect(0,h*.46,w,h*.54);
    }
  }

  function drawDropShape(ctx,x,y,r,alpha=1){
    ctx.save(); ctx.globalAlpha=alpha;
    const g=ctx.createRadialGradient(x-r*.35,y-r*.38,2,x,y,r*1.15);
    g.addColorStop(0,"#f7ffff"); g.addColorStop(.35,"#bcecff"); g.addColorStop(.78,"#3d92c5"); g.addColorStop(1,"#15506f");
    ctx.fillStyle=g; ctx.shadowColor="rgba(220,250,255,.7)"; ctx.shadowBlur=14;
    ctx.beginPath();
    ctx.moveTo(x,y-r*1.35);
    ctx.bezierCurveTo(x+r*.82,y-r*.45,x+r*.78,y+r*.66,x,y+r);
    ctx.bezierCurveTo(x-r*.78,y+r*.66,x-r*.82,y-r*.45,x,y-r*1.35);
    ctx.fill(); ctx.restore();
  }

  function drawRealWaterTop(w,h, train=false){
    drawWaterBase(w,h,true);
    const cx=w*.34, cy=h*.48;
    const age=Math.max(0,simTime-modelState.fxStart);
    const dropPeriod=train ? modelState.repeatEvery : 99;
    const drops=train ? Math.max(4,modelState.pulseCount) : 1;

    for(let k=0;k<drops;k++){
      const local=age-k*dropPeriod;
      if(local<0) continue;
      const fall=1.05;
      if(local<fall){
        const q=smooth01(local/fall);
        drawDropShape(mctx,cx,cy-150*(1-q),11+3*q,1);
      }
      const p=local-fall;
      if(p>=0 && p<3.6){
        const maxR=Math.min(w*.31,h*.42);
        const rr=Math.min(maxR,18+p*108);
        const a=Math.max(0,1-p/3.6);
        for(let j=0;j<3;j++){
          const rj=rr-j*12;
          if(rj>4){
            mctx.strokeStyle=`rgba(238,253,255,${a*(.82-j*.18)})`;
            mctx.lineWidth=Math.max(1.2,3.5-j*.8);
            mctx.beginPath(); mctx.ellipse(cx,cy,rj,rj*.38,0,0,Math.PI*2); mctx.stroke();
          }
        }
      }
    }
  }

  function drawTopToWater(w,h){
    const p=smooth01((simTime-modelState.fxStart)/modelState.fxDuration);
    mctx.save(); mctx.globalAlpha=1-p; drawTopModel(w,h); mctx.restore();
    mctx.save(); mctx.globalAlpha=p; drawRealWaterTop(w,h,false); mctx.restore();
  }

  function topParticleLayout(w,h){
    const cx=w*.34, cy=h*.47, pts=[];
    const maxRad=Math.min(w*.29,h*.41), rings=11;
    for(let ring=0;ring<rings;ring++){
      const rad=ring===0?0:maxRad*ring/(rings-1);
      const count=ring===0?1:Math.max(10,Math.round(2*Math.PI*rad/25));
      for(let j=0;j<count;j++){
        const a=count===1?0:2*Math.PI*j/count+(ring%2?.10:0);
        pts.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad]);
      }
    }
    return pts;
  }

  function drawTopToProfile(w,h){
    drawWaterBase(w,h,false);
    const p=smooth01((simTime-modelState.fxStart)/modelState.fxDuration);
    const pts=topParticleLayout(w,h);
    const left=w*.08,right=w*.64,base=h*.52;
    const rr=Math.max(5,Math.min(9,w/150));
    pts.forEach((pt,idx)=>{
      const tx=left+(right-left)*(idx/Math.max(1,pts.length-1));
      const ty=base;
      const x=pt[0]+(tx-pt[0])*p;
      const y=pt[1]+(ty-pt[1])*p;
      const g=mctx.createRadialGradient(x-rr*.3,y-rr*.35,1,x,y,rr);
      g.addColorStop(0,"#f2fcff"); g.addColorStop(.35,"#9edcf7"); g.addColorStop(1,"#246d99");
      mctx.fillStyle=g; mctx.beginPath(); mctx.arc(x,y,rr,0,Math.PI*2); mctx.fill();
    });
  }

  function waterProfileY(x,w,h,age,train=false){
    const left=w*.08,right=w*.65,base=h*.52;
    const width=70;
    let y=base;
    const pulses=train?Math.max(5,modelState.pulseCount):1;
    for(let k=0;k<pulses;k++){
      const local=age-k*modelState.repeatEvery;
      if(local<0) continue;
      const c=left+local*118;
      const dx=x-c;
      y-=34*Math.exp(-(dx*dx)/(2*width*width));
    }
    return y;
  }

  function drawWaterProfile(w,h,train=false,withDrop=false){
    drawWaterBase(w,h,false);
    const age=Math.max(0,simTime-modelState.fxStart);
    const left=w*.06,right=w*.66,base=h*.52;
    mctx.fillStyle="rgba(45,149,201,.28)";
    mctx.beginPath(); mctx.moveTo(left,h);
    for(let x=left;x<=right;x+=4) mctx.lineTo(x,waterProfileY(x,w,h,age,train));
    mctx.lineTo(right,h); mctx.closePath(); mctx.fill();
    mctx.strokeStyle="rgba(244,254,255,.95)"; mctx.lineWidth=4; mctx.beginPath();
    for(let x=left;x<=right;x+=4){ const y=waterProfileY(x,w,h,age,train); if(x===left)mctx.moveTo(x,y); else mctx.lineTo(x,y); }
    mctx.stroke();

    if(withDrop){
      const period=modelState.repeatEvery;
      const k=Math.floor(age/period);
      const local=age-k*period;
      if(local<.82){
        const q=smooth01(local/.82);
        drawDropShape(mctx,left+6,base-145*(1-q),10,1);
      }
    }
  }

  function ropeDisplacement(x,w,h,age,train=false){
    const left=w*.07,right=w*.65,base=h*.50;
    const width=58;
    let d=0;
    const pulses=train?Math.max(5,modelState.pulseCount):1;
    for(let k=0;k<pulses;k++){
      const local=age-k*modelState.repeatEvery;
      if(local<0) continue;
      const c=right-local*122;
      const dx=x-c;
      d-=42*Math.exp(-(dx*dx)/(2*width*width));
    }
    return d;
  }

  function drawHandAtRight(w,h,age,periodic=false){
    const x=w*.665, base=h*.50;
    const wiggle=periodic?20*Math.sin(age*2*Math.PI/modelState.repeatEvery):0;
    mctx.save();
    mctx.strokeStyle="#d7a275"; mctx.fillStyle="#e7b58a"; mctx.lineWidth=12; mctx.lineCap="round";
    mctx.beginPath(); mctx.moveTo(x+72,base+16); mctx.lineTo(x+22,base+wiggle*.55); mctx.stroke();
    mctx.beginPath(); mctx.ellipse(x+8,base+wiggle*.55,20,15,0,0,Math.PI*2); mctx.fill();
    for(let j=0;j<3;j++){mctx.beginPath();mctx.moveTo(x+2,base-5+wiggle*.55+j*7);mctx.lineTo(x-20,base-12+wiggle*.55+j*6);mctx.stroke();}
    mctx.restore();
  }

  function drawRope(w,h,beads=false,train=false){
    const age=Math.max(0,simTime-modelState.fxStart);
    const left=w*.07,right=w*.65,base=h*.50;
    drawWaterBase(w,h,false);
    // neutral wall/floor treatment so it reads as a rope, not water
    mctx.fillStyle="rgba(245,239,225,.92)"; mctx.fillRect(0,0,w,h);
    mctx.strokeStyle="rgba(95,70,48,.96)"; mctx.lineWidth=beads?2.2:5.5; mctx.lineCap="round";
    mctx.beginPath();
    for(let x=left;x<=right;x+=4){
      const y=base+ropeDisplacement(x,w,h,age,train);
      if(x===left)mctx.moveTo(x,y); else mctx.lineTo(x,y);
    }
    mctx.stroke();

    if(beads){
      const n=28, step=(right-left)/(n-1), r=Math.max(7,Math.min(10,w/135));
      for(let i=0;i<n;i++){
        const x=left+i*step, y=base+ropeDisplacement(x,w,h,age,train);
        const g=mctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r);
        g.addColorStop(0,"#fffdf6");g.addColorStop(.35,"#f2c86d");g.addColorStop(1,"#a95332");
        mctx.fillStyle=g;mctx.beginPath();mctx.arc(x,y,r,0,Math.PI*2);mctx.fill();
      }
    }

    // En el tren de pulsos la manito solo debe verse mientras está generando
    // pulsos. Cuando deja de excitar la cuerda, desaparece para que se observe
    // únicamente la propagación de los pulsos ya emitidos.
    let showHand = true;
    if(train){
      const lastPulseStart = Math.max(0,(Math.max(1,modelState.pulseCount)-1) * modelState.repeatEvery);
      const handMotionTail = modelState.repeatEvery * 0.22;
      showHand = age <= lastPulseStart + handMotionTail;
    }
    if(showHand) drawHandAtRight(w,h,age,train);
  }

  function drawTopPulseOnly(w,h,train=false){
    drawWaterBase(w,h,true);
    const cx=w*.34,cy=h*.48,age=Math.max(0,simTime-modelState.fxStart);
    const pulses=train?Math.max(5,modelState.pulseCount):1;
    for(let k=0;k<pulses;k++){
      const local=age-k*modelState.repeatEvery;
      if(local<0)continue;
      const rr=18+local*115, maxR=Math.min(w*.31,h*.42);
      if(rr<maxR){
        const a=Math.max(0,1-rr/maxR);
        mctx.strokeStyle=`rgba(245,254,255,${.85*a})`;mctx.lineWidth=4;
        mctx.beginPath();mctx.ellipse(cx,cy,rr,rr*.39,0,0,Math.PI*2);mctx.stroke();
      }
    }
  }

  function drawModel(){
    const w = innerWidth, h = innerHeight;
    mctx.clearRect(0,0,w,h);
    if(!modelState.visible) return;

    if(modelState.mode === "top"){
      drawTopModel(w,h);
      return;
    }
    if(modelState.mode === "topToWater"){ drawTopToWater(w,h); return; }
    if(modelState.mode === "waterTop"){ drawRealWaterTop(w,h,false); return; }
    if(modelState.mode === "waterTopTrain"){ drawRealWaterTop(w,h,true); return; }
    if(modelState.mode === "topToProfile"){ drawTopToProfile(w,h); return; }
    if(modelState.mode === "waterProfile"){ drawWaterProfile(w,h,false,false); return; }
    if(modelState.mode === "waterProfileTrain"){ drawWaterProfile(w,h,true,true); return; }
    if(modelState.mode === "rope"){ drawRope(w,h,false,false); return; }
    if(modelState.mode === "ropeBeads"){ drawRope(w,h,true,false); return; }
    if(modelState.mode === "ropeTrain"){ drawRope(w,h,false,true); return; }
    if(modelState.mode === "waterTopPulse"){ drawTopPulseOnly(w,h,false); return; }
    if(modelState.mode === "waterTopPulseTrain"){ drawTopPulseOnly(w,h,true); return; }

    // Water surface background similar to photographs
    const sky = mctx.createLinearGradient(0,0,0,h*0.52);
    sky.addColorStop(0,"rgba(240,244,250,.96)");
    sky.addColorStop(1,"rgba(207,232,246,.96)");
    mctx.fillStyle=sky; mctx.fillRect(0,0,w,h);

    const water = mctx.createLinearGradient(0,h*0.48,0,h);
    water.addColorStop(0,"rgba(194,229,247,.9)");
    water.addColorStop(.45,"rgba(123,204,237,.96)");
    water.addColorStop(1,"rgba(41,142,196,.98)");
    mctx.fillStyle=water; mctx.fillRect(0,h*0.46,w,h*0.54);

    const surfaceY = h*0.52;
    // quiet surface rings
    mctx.strokeStyle="rgba(213,242,255,.35)";
    mctx.lineWidth = 2;
    for(let r=0;r<4;r++){
      mctx.beginPath();
      mctx.ellipse(w*0.34 + r*5, surfaceY+3*r, w*(0.18 + r*0.035), 10+r*4, 0, 0, Math.PI*2);
      mctx.stroke();
    }

    const n = 13;
    const left = w*0.10, right = w*0.65;
    const step = (right-left)/(n-1);
    const baseY = surfaceY - 3;
    const r = Math.max(12,Math.min(18,w/78));
    const revealCount = Math.max(1, Math.ceil(modelState.reveal*n));
    const ys = new Array(n).fill(baseY);

    // pulse propagation with three decreasing pulses
    if(modelState.mode === "pulses"){
      const t = simTime - modelState.start;
      const pulseGap = 0.95;
      const delayPer = 0.16;
      const baseAmp = 34;
      const pulses = [
        {amp:baseAmp, t0:0},
        {amp:baseAmp*0.5, t0:pulseGap},
        {amp:baseAmp*0.25, t0:pulseGap*2}
      ];

      let allSmall = true;

      for(let i=0;i<n;i++){
        let disp = 0;
        const localDelay = i*delayPer;

        for(const p of pulses){
          const tau = t - p.t0 - localDelay;
          if(tau >= 0 && tau <= 1.0){
            const env = Math.exp(-2.3*tau);
            disp += p.amp * env * Math.sin(2*Math.PI*1.05*tau);
          }
        }

        ys[i] = baseY + disp;
        if(Math.abs(disp) > 0.45) allSmall = false;
      }

      // En el contacto, la primera bolita se hunde de manera visible.
      // Después recupera su posición y comienza la secuencia de oscilaciones.
      const impactAge = simTime - (modelState.dropTime + 1.60);
      if(impactAge >= 0 && impactAge <= 0.62){
        const sink = 30 * Math.sin(Math.PI * (impactAge/0.62));
        ys[0] += Math.max(0,sink);
        allSmall = false;
      }

      if(t > pulses[pulses.length-1].t0 + delayPer*(n-1) + 1.2 && allSmall){
        modelState.settled = true;
      }
    }

    // strings
    for(let i=0;i<Math.min(n-1,revealCount-1);i++){
      const x1=left+i*step, x2=left+(i+1)*step;
      mctx.strokeStyle="rgba(237,248,255,.72)";
      mctx.lineWidth=2;
      mctx.beginPath();
      const seg=12;
      for(let s=0;s<=seg;s++){
        const tt=s/seg;
        const x=x1+(x2-x1)*tt;
        const y=ys[i]+(ys[i+1]-ys[i])*tt + Math.sin(tt*Math.PI*seg)*2.5;
        if(s===0)mctx.moveTo(x,y); else mctx.lineTo(x,y);
      }
      mctx.stroke();
    }

    // balls
    for(let i=0;i<Math.min(n,revealCount);i++){
      const x=left+i*step, y=ys[i];
      const grad = mctx.createRadialGradient(x-r*.4,y-r*.45,3,x,y,r);
      grad.addColorStop(0, "rgba(243,253,255,.98)");
      grad.addColorStop(.28, "rgba(157,222,255,.98)");
      grad.addColorStop(.68, "rgba(54,128,179,.98)");
      grad.addColorStop(1, "rgba(15,47,72,.98)");
      mctx.fillStyle = grad;
      mctx.shadowColor="rgba(132,221,255,.66)";
      mctx.shadowBlur=14;
      mctx.beginPath(); mctx.arc(x,y,r,0,Math.PI*2); mctx.fill();
      mctx.shadowBlur=0;
      // reflection on surface
      mctx.strokeStyle="rgba(230,250,255,.32)";
      mctx.lineWidth=1.4;
      mctx.beginPath(); mctx.ellipse(x, baseY+24, 24, 7, 0, 0, Math.PI*2); mctx.stroke();
    }

    // Gota que cae sobre la primera bolita.
    // Tiene el MISMO tamaño que las bolitas del modelo, cae lentamente,
    // hunde la primera bolita y luego continúa hacia abajo, desviándose
    // ligeramente a un lado hasta desaparecer.
    if(modelState.mode === "pulses"){
      const age = simTime - modelState.dropTime;
      const fallTime = 1.60;
      const disappearTime = 1.05;
      const x0 = left;
      const yStart = surfaceY - 175;
      const yContact = baseY - 2*r - 2;

      let dx = 0;
      let y = yStart;
      let alpha = 1;

      if(age <= fallTime){
        // Caída lenta: aceleración suave, pero sin precipitarse.
        const p = Math.max(0,Math.min(1,age/fallTime));
        const eased = p*p*(3-2*p);
        y = yStart + (yContact-yStart)*eased;
      }else{
        // Tras tocar la primera bolita, la gota atraviesa visualmente la superficie,
        // baja y se aparta hacia la derecha antes de desaparecer.
        const q = Math.max(0,Math.min(1,(age-fallTime)/disappearTime));
        y = yContact + q*(h*0.16);
        dx = q*(step*0.72);
        alpha = 1-q;
      }

      if(age <= fallTime + disappearTime){
        const x = x0 + dx;
        mctx.save();
        mctx.globalAlpha = alpha;

        // Debajo de la superficie la gota se vuelve más azul y tenue.
        const under = age > fallTime;
        const dg = mctx.createRadialGradient(
          x-r*.35, y-r*.45, 2,
          x, y, r
        );
        dg.addColorStop(0, under ? "rgba(220,249,255,.88)" : "#f2feff");
        dg.addColorStop(.35, under ? "rgba(128,211,244,.82)" : "#b7e8ff");
        dg.addColorStop(.75, under ? "rgba(40,126,180,.75)" : "#3f8ec3");
        dg.addColorStop(1, under ? "rgba(12,68,104,.55)" : "#12415f");

        mctx.fillStyle = dg;
        mctx.shadowColor = under ? "rgba(80,170,220,.25)" : "rgba(160,225,255,.55)";
        mctx.shadowBlur = under ? 7 : 14;

        // Gota de altura y anchura comparables al diámetro de una bolita del modelo.
        mctx.beginPath();
        mctx.moveTo(x, y-r);
        mctx.bezierCurveTo(
          x+r*.80, y-r*.55,
          x+r*.76, y+r*.65,
          x, y+r
        );
        mctx.bezierCurveTo(
          x-r*.76, y+r*.65,
          x-r*.80, y-r*.55,
          x, y-r
        );
        mctx.fill();

        mctx.restore();
      }
    }
  }

  function sceneBoardModel1(){
    updateBoard("Modelo propuesto", [
      "Cada bolita representa una pequeña región del medio.",
      "Las bolitas están unidas a sus vecinas mediante hilos elásticos.",
      "Es un modelo sencillo: el movimiento real del agua es más complejo."
    ]);
  }

  function sceneBoardModel2(){
    updateBoard("Propagación de la perturbación", [
      "El impacto altera el estado de equilibrio de la primera bolita.",
      "Su movimiento altera a las bolitas vecinas y estas a las siguientes.",
      "La alteración se transmite sucesivamente por el conjunto."
    ]);
  }

  function sceneBoardModel3(){
    updateBoard("Propagación", [
      "Propagación: transmisión sucesiva de la perturbación hacia regiones cada vez más alejadas.",
      "Cada bolita se mueve alrededor de su propia posición de equilibrio.",
      "Los elementos del medio no viajan junto con la perturbación."
    ]);
  }


  function sceneBoardTop(){
    updateBoard("Vista desde arriba", [
      "Las bolitas llenan la superficie y representan pequeñas regiones del agua vistas desde arriba.",
      "Más pequeña: el elemento se hunde. Tamaño normal: posición de equilibrio.",
      "Más grande: el elemento sube sobre la superficie."
    ]);
  }


  function sceneBoardRadial(){
    updateBoard("Propagación radial", [
      "La perturbación alcanza regiones cada vez más alejadas del punto de impacto.",
      "Vista desde arriba, la propagación ocurre en todas las direcciones de la superficie.",
      "Las deformaciones visibles se observan como circunferencias que aumentan de tamaño."
    ]);
  }

  function sceneBoardProfile(){
    updateBoard("Perfil del líquido", [
      "La perturbación también puede seguirse observando el perfil del medio.",
      "Una elevación o depresión permite visualizar la región donde se manifiesta.",
      "La deformación avanza; una misma porción del medio no viaja con ella."
    ]);
  }

  function sceneBoardPulse(){
    updateBoard("Pulso", [
      "Pulso: perturbación de duración limitada que se propaga y ocupa una región determinada.",
      "En una cuerda puede verse como una deformación localizada que avanza.",
      "En el agua puede manifestarse como una elevación o depresión que se aleja del origen."
    ]);
  }

  function sceneBoardTrain(){
    updateBoard("Tren de pulsos", [
      "Perturbaciones de duración limitada se producen sucesivamente.",
      "Cada una genera un pulso que se propaga por el medio.",
      "A la sucesión la llamaremos tren de pulsos."
    ]);
  }

  // -------------------------
  // Scenes
  // -------------------------
  const scenes = [
    async token => {
      resetVisuals();
      sceneBoardIntro();

      // La primera foto aparece inmediatamente al pulsar Iniciar.
      // Las tres imágenes ya están precargadas en capas independientes.
      const photoSequence = playOpeningPhotoSequence(token);
      await fadeMusic(MUSIC_HIGH,250);

      // La locución se conserva exactamente como estaba.
      const openingLocution = (async()=>{
        setText("¿Habrá <span class='yellow'>oscilaciones</span> que no puedan detectarse con nuestros sentidos?");
        await speakOpeningQuestion(token);

        setText("<span class='yellow'>Te convido</span> a un juego de imaginación.");
        await narration(NARR.invite,{rate:.84},token);
        hideText();
      })();

      await Promise.all([photoSequence, openingLocution]);

      // Conserva la tercera fotografía y devuelve el control a la etiqueta
      // usada por el resto de la animación.
      closeOpeningPhotos(2);
      overlayState.mode = "none";
      await wait(700,token);
    },

    async token => {
      sceneBoardPerturb();
      tag.classList.add("show");
      await showPhoto(1,token,0,true);
      setText("<span class='yellow'>PERTURBACIÓN</span>: alteración de un elemento del medio respecto de su estado de equilibrio.");
      await narration(NARR.perturb,{rate:.86},token);
      hideText();
      await fadeMusic(MUSIC_HIGH,220);
      await wait(1800,token);
      tag.classList.remove("show");
    },

    async token => {
      sceneBoardOsc();
      await showPhoto(1,token,0,false);
      overlayState.mode = "osc";
      overlayState.start = simTime;
      setText("La perturbación puede hacer que el elemento se mueva y, bajo determinadas condiciones, que <span class='yellow'>oscile</span>.");
      await narration(NARR.observe1,{rate:.88},token);
      await narration(NARR.observe2,{rate:.82},token);
      await narration(NARR.difference,{rate:.88},token);
      hideText();
      await wait(800,token);
      overlayState.mode = "none";
    },

    async token => {
      sceneBoardModel1();
      photo.classList.remove("visible");
      modelCanvas.classList.add("show");
      modelState.visible = true;
      modelState.mode = "rest";
      modelState.reveal = 0;
      const p1 = narration(NARR.model1,{rate:.9},token);
      for(let k=1;k<=12;k++){
        modelState.reveal = k/12;
        await wait(120,token);
      }
      await p1;
      await narration(NARR.model2,{rate:.88},token);
      await wait(700,token);
    },

    async token => {
      sceneBoardModel2();
      setText("El impacto altera una bolita; su movimiento altera a las vecinas y el proceso continúa.");
      await narration(NARR.model3,{rate:.86},token);
      hideText();

      // Mostrar la caída de la gota y la propagación solamente dos veces.
      await runPulseCycle(token);
      await runPulseCycle(token);
    },

    async token => {
      sceneBoardModel3();
      setText("<span class='yellow'>PROPAGACIÓN</span>: la perturbación se transmite sucesivamente hacia regiones cada vez más alejadas.");

      const narrModel4 = narration(NARR.model4,{rate:.80},token);
      const animModel4 = (async () => {
        await runPulseCycle(token);
        await runPulseCycle(token);
      })();

      await narrModel4;
      await animModel4;
      await fadeMusic(MUSIC_HIGH,260);
      await wait(900,token);
      hideText();
    },

    async token => {
      // Nueva escena: el mismo modelo visto desde arriba.
      sceneBoardTop();

      await narration(NARR.topView,{rate:.84},token);

      // Al terminar la locución cambia la representación.
      modelState.visible = true;
      modelCanvas.classList.add("show");
      modelState.mode = "top";

      // Repetimos TRES VECES la perturbación completa:
      // cae la gota, se generan los tres pulsos y todo vuelve al reposo.
      for(let repeticion=0; repeticion<3; repeticion++){
        modelState.topSettled = false;
        modelState.topStart = simTime;
        modelState.topImpact = simTime + 1.85;

        while(!modelState.topSettled){
          if(token !== runToken) throw abortError();
          await wait(120,token);
        }

        // Breve reposo antes de repetir la caída.
        if(repeticion < 2){
          await wait(900,token);
        }
      }

      // Conclusión inmediata de la vista superior.
      sceneBoardRadial();
      setText("Ahora esta simulación nos permite asegurar que la perturbación se propaga <span class='yellow'>radialmente</span>.");
      await narration(NARR.radialConclusion,{rate:.82},token);
      hideText();

      // Las bolitas se transforman progresivamente en una superficie líquida tranquila.
      modelState.mode="topToWater";
      modelState.fxStart=simTime;
      modelState.fxDuration=2.2;
      const rainNarr=narration(NARR.rainDrop,{rate:.84},token);
      await wait(2200,token);
      await rainNarr;

      modelState.mode="waterTop";
      modelState.fxStart=simTime;
      setText("Se verían <span class='yellow'>elevaciones y depresiones</span> que se alejan radialmente del lugar del impacto.");
      await narration(NARR.radialCrests,{rate:.82},token);
      hideText();

      // Pausa musical para observar otra vez, sin locución.
      await fadeMusic(MUSIC_HIGH,260);
      modelState.fxStart=simTime;
      await wait(5000,token);

      // Regresa brevemente al modelo de bolitas y colapsa la vista superior hasta un perfil.
      modelState.mode="top";
      modelState.topStart=simTime-6;
      modelState.topImpact=simTime-5;
      modelState.topSettled=true;
      await wait(900,token);
      modelState.mode="topToProfile";
      modelState.fxStart=simTime;
      modelState.fxDuration=2.4;
      await wait(2400,token);

      sceneBoardProfile();
      modelState.mode="waterProfile";
      modelState.fxStart=simTime;
      setText("En el <span class='yellow'>perfil</span> del líquido, una deformación visible permite seguir la propagación.");
      await narration(NARR.profile,{rate:.84},token);
      hideText();
      await wait(1900,token);
    },

    async token => {
      sceneBoardPulse();

      // Aparece una cuerda horizontal. La mano está en el extremo DERECHO,
      // por lo que el pulso viaja hacia la IZQUIERDA: cambiamos deliberadamente
      // el sentido para evitar asociar propagación con una dirección fija.
      modelState.mode="rope";
      modelState.fxStart=simTime;
      setText("En una <span class='yellow'>cuerda</span> también puede propagarse una perturbación.");
      await narration(NARR.rope,{rate:.84},token);
      hideText();
      await wait(2300,token);

      // Transición visual: la cuerda se representa como bolitas unidas por segmentos cortos.
      modelState.mode="ropeBeads";
      modelState.fxStart=simTime;
      await wait(2600,token);

      // Definición de pulso: perturbación de duración limitada y localizada.
      setText("<span class='yellow'>PULSO</span>: perturbación de duración limitada que se propaga y ocupa, en cada instante, una región determinada.");
      const pulseNarr=narration(NARR.pulseA,{rate:.82},token);
      modelState.fxStart=simTime;
      await wait(2700,token);
      await pulseNarr;
      hideText();

      // El mismo concepto, ahora en el perfil del agua.
      modelState.mode="waterProfile";
      modelState.fxStart=simTime;
      setText("En el agua, un pulso puede verse como una <span class='yellow'>elevación o depresión</span> que se aleja del origen.");
      await narration(NARR.pulseB,{rate:.84},token);
      hideText();
      await wait(2300,token);

      // Y finalmente visto desde arriba como una sola circunferencia que se expande.
      modelState.mode="waterTopPulse";
      modelState.fxStart=simTime;
      await fadeMusic(MUSIC_HIGH,220);
      await wait(3200,token);
    },

    async token => {
      sceneBoardTrain();
      setText("Si se producen perturbaciones de duración limitada sucesivamente, se genera un <span class='yellow'>tren de pulsos</span>.");
      const trainNarr=narration(NARR.train,{rate:.82},token);

      // 1. Vista superior: circunferencias sucesivas.
      modelState.repeatEvery=1.25;
      modelState.pulseCount=6;
      modelState.mode="waterTopPulseTrain";
      modelState.fxStart=simTime;
      await wait(3600,token);

      // 2. Perfil: gotas periódicas y varias crestas sucesivas.
      modelState.mode="waterProfileTrain";
      modelState.fxStart=simTime;
      await wait(3600,token);

      // 3. Cuerda: la mano mueve sistemáticamente el extremo derecho
      // y los pulsos se propagan hacia la izquierda.
      modelState.mode="ropeTrain";
      modelState.fxStart=simTime;
      await trainNarr;
      hideText();

      // Después de decir «un tren de pulsos», dejamos exactamente dos segundos
      // antes de iniciar la reflexión de cierre.
      await fadeMusic(MUSIC_HIGH,260);
      await wait(2000,token);

      // Primera parte del cierre: la animación continúa mientras se resume lo observado.
      await narration(NARR.closingBeforeQuestion,{rate:.80},token);

      // La pregunta aparece SOLO AL FINAL. En este instante se detiene el movimiento
      // visual y la última imagen queda congelada.
      setText("¿<span class='yellow'>QUÉ</span> se propaga?");
      freezeModelFrame = true;
      await speakFinalQuestions(token);

      // La última frase se pronuncia sobre la imagen ya detenida.
      await narration(NARR.closingAfterQuestion,{rate:.80},token);
      await fadeMusic(MUSIC_HIGH,260);

      // Al finalizar quedan únicamente los botones Repetir y Salir.
      finished = true;
      backBtn.textContent = "Repetir";
      pauseBtn.style.display = "none";
      controls.classList.add("show");
    }
  ];

  async function runFrom(index=0){
    const token = ++runToken;
    cancelSpeech();
    paused = false;
    freezeModelFrame = false;
    pauseBtn.textContent = "Pausar";
    pauseBtn.style.display = "";
    try{
      if(music.paused) await music.play().catch(()=>{});
      for(let i=index;i<scenes.length;i++){
        if(token !== runToken) throw abortError();
        currentScene = i;
        await scenes[i](token);
      }
    }catch(e){
      if(e.name !== "AbortError") console.error(e);
    }
  }

  // -------------------------
  // Controls
  // -------------------------
  backBtn.addEventListener("click",()=>{
    if(finished){
      elapsedActiveMs = 0;
      controls.classList.remove("show");
      runFrom(0);
    }else{
      const target = Math.max(0,currentScene-1);
      controls.classList.remove("show");
      runFrom(target);
    }
  });

  pauseBtn.addEventListener("click",()=>{
    paused = !paused;
    pauseBtn.textContent = paused ? "Continuar" : "Pausar";
    if(paused){
      musicWasPlaying = !music.paused;
      openingWasPlaying = !openingQuestionAudio.paused && !openingQuestionAudio.ended;
      music.pause();
      openingQuestionAudio.pause();
      if("speechSynthesis" in window) speechSynthesis.pause();
    }else{
      if(musicWasPlaying) music.play().catch(()=>{});
      if(openingWasPlaying && !openingQuestionAudio.ended){
        openingQuestionAudio.play().catch(()=>{});
      }
      if("speechSynthesis" in window) speechSynthesis.resume();
    }
  });

  exitBtn.addEventListener("click",()=>{
    ++runToken;
    cancelSpeech();
    music.pause();
    resetVisuals();
    controls.classList.remove("show");
    startScreen.style.display = "flex";
  });


  startBtn.addEventListener("click",async()=>{
    startScreen.style.display = "none";
    music.volume = MUSIC_HIGH;
    await music.play().catch(()=>{});
    if("speechSynthesis" in window) speechSynthesis.getVoices();
    elapsedActiveMs = 0;
    controls.classList.remove("show");
    runFrom(0);
  });

  if("speechSynthesis" in window){
    speechSynthesis.onvoiceschanged = () => pickVoice();
  }

  // -------------------------
  // Animation loop
  // -------------------------
  function raf(now){
    const dt = Math.min(0.05, (now-lastRAF)/1000);
    lastRAF = now;
    if(!paused){
      simTime += dt;
      elapsedActiveMs += dt*1000;
      if(elapsedActiveMs >= 60000 && !finished) controls.classList.add("show");
    }
    drawOverlay();
    if(!freezeModelFrame) drawModel();
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);

  photos.forEach(src => preloadOnePhoto(src));
})();
</script>
</body>
</html>
